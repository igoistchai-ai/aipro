<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#050505">
<title>NZX AI</title>

<style>
:root{
    --bg:#030303;
    --panel:rgba(13,13,13,.72);
    --panel2:rgba(255,255,255,.035);
    --line:rgba(255,255,255,.085);
    --line2:rgba(255,255,255,.05);
    --text:#ededed;
    --muted:#737373;
    --muted2:#454545;
    --white:#fff;
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    background:var(--bg);
    color:var(--text);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        Inter,
        Segoe UI,
        Arial,
        sans-serif;
}

button,
input,
textarea,
select{
    font:inherit;
}

button{
    cursor:pointer;
    border:0;
}

#background{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    overflow:hidden;
}

#stars{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    opacity:.45;
}

.bgGlow{
    position:absolute;
    width:55vw;
    height:55vw;
    max-width:700px;
    max-height:700px;
    border-radius:50%;
    left:58%;
    top:38%;
    transform:translate(-50%,-50%);
    background:radial-gradient(
        circle,
        rgba(255,255,255,.07) 0%,
        rgba(255,255,255,.018) 28%,
        transparent 68%
    );
    filter:blur(18px);
    animation:glowMove 10s ease-in-out infinite alternate;
}

.bgGrid{
    position:absolute;
    inset:0;
    opacity:.055;
    background-image:
        linear-gradient(rgba(255,255,255,.15) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.15) 1px,transparent 1px);
    background-size:80px 80px;
    mask-image:radial-gradient(circle at 65% 45%,#000,transparent 70%);
}

@keyframes glowMove{
    from{
        transform:translate(-50%,-50%) scale(.92);
        opacity:.55;
    }
    to{
        transform:translate(-45%,-53%) scale(1.08);
        opacity:.9;
    }
}

#app{
    position:relative;
    z-index:2;
    display:flex;
    width:100%;
    height:100%;
}

/* SIDEBAR */

.sidebar{
    width:274px;
    flex-shrink:0;
    height:100%;
    display:flex;
    flex-direction:column;
    padding:15px;
    gap:12px;
    background:rgba(7,7,7,.65);
    border-right:1px solid var(--line2);
    backdrop-filter:blur(32px) saturate(125%);
    -webkit-backdrop-filter:blur(32px) saturate(125%);
    transition:transform .25s ease;
}

.brand{
    display:flex;
    align-items:center;
    gap:11px;
    padding:4px 4px 11px;
}

.brandIcon{
    width:39px;
    height:39px;
    display:grid;
    place-items:center;
    border-radius:13px;
    color:white;
    font-weight:900;
    font-size:17px;
    background:
        radial-gradient(circle at 30% 20%,#333,transparent 42%),
        linear-gradient(145deg,#202020,#080808);
    border:1px solid rgba(255,255,255,.12);
    box-shadow:
        inset 0 1px rgba(255,255,255,.08),
        0 12px 35px rgba(0,0,0,.4);
}

.brandName{
    font-size:14px;
    font-weight:750;
    letter-spacing:-.2px;
}

.brandSub{
    margin-top:3px;
    color:#555;
    font-size:9px;
    letter-spacing:.6px;
    text-transform:uppercase;
}

.newChat{
    height:43px;
    width:100%;
    border-radius:13px;
    color:#eee;
    background:rgba(255,255,255,.065);
    border:1px solid var(--line);
    font-size:11px;
    font-weight:650;
    transition:.16s;
}

.newChat:hover{
    background:rgba(255,255,255,.1);
    border-color:rgba(255,255,255,.13);
}

.newChat:active{
    transform:scale(.98);
}

.history{
    flex:1;
    overflow:auto;
    padding-right:2px;
}

.history::-webkit-scrollbar,
.messages::-webkit-scrollbar,
textarea::-webkit-scrollbar,
.codePre::-webkit-scrollbar{
    width:4px;
    height:4px;
}

.history::-webkit-scrollbar-thumb,
.messages::-webkit-scrollbar-thumb,
textarea::-webkit-scrollbar-thumb,
.codePre::-webkit-scrollbar-thumb{
    background:#242424;
    border-radius:20px;
}

.historyLabel{
    padding:7px 5px 7px;
    color:#4e4e4e;
    font-size:8px;
    letter-spacing:1.2px;
    text-transform:uppercase;
}

.chatItem{
    width:100%;
    margin-bottom:3px;
    padding:10px 10px;
    text-align:left;
    border-radius:11px;
    color:#777;
    background:transparent;
    border:1px solid transparent;
    transition:.15s;
}

.chatItem:hover{
    background:rgba(255,255,255,.035);
    color:#aaa;
}

.chatItem.active{
    color:#eee;
    background:rgba(255,255,255,.065);
    border-color:rgba(255,255,255,.065);
}

.chatTitle{
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
    font-size:10px;
}

.chatTime{
    margin-top:3px;
    color:#444;
    font-size:8px;
}

.profile{
    display:flex;
    align-items:center;
    gap:9px;
    padding:9px;
    border-radius:14px;
    background:rgba(255,255,255,.035);
    border:1px solid var(--line2);
    cursor:pointer;
}

.profileAvatar{
    width:35px;
    height:35px;
    flex-shrink:0;
    border-radius:11px;
    overflow:hidden;
    display:grid;
    place-items:center;
    color:#ddd;
    font-size:11px;
    font-weight:750;
    background:#171717;
    border:1px solid rgba(255,255,255,.08);
}

.profileAvatar img{
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
}

.profileInfo{
    min-width:0;
    flex:1;
}

.profileName{
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
    font-size:10px;
    font-weight:650;
}

.profileStatus{
    margin-top:3px;
    color:#505050;
    font-size:8px;
}

.profileArrow{
    color:#444;
}

/* MAIN */

.main{
    min-width:0;
    flex:1;
    height:100%;
    display:flex;
    flex-direction:column;
}

.topbar{
    height:64px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 17px;
    background:rgba(3,3,3,.35);
    border-bottom:1px solid var(--line2);
    backdrop-filter:blur(24px);
    -webkit-backdrop-filter:blur(24px);
}

.topLeft{
    display:flex;
    align-items:center;
    gap:9px;
}

.mobileMenu{
    display:none;
    width:35px;
    height:35px;
    border-radius:11px;
    color:#aaa;
    background:rgba(255,255,255,.05);
    border:1px solid var(--line);
}

.modelSelector{
    position:relative;
}

.modelSelect{
    height:37px;
    min-width:180px;
    padding:0 34px 0 12px;
    appearance:none;
    -webkit-appearance:none;
    border-radius:11px;
    color:#ddd;
    outline:none;
    background:rgba(255,255,255,.045);
    border:1px solid var(--line);
    font-size:10px;
    font-weight:650;
}

.modelSelector:after{
    content:"⌄";
    position:absolute;
    right:12px;
    top:9px;
    color:#666;
    pointer-events:none;
    font-size:12px;
}

.modelSelect option{
    color:#fff;
    background:#101010;
}

.topRight{
    display:flex;
    gap:6px;
}

.topButton{
    height:36px;
    padding:0 12px;
    border-radius:10px;
    color:#999;
    background:rgba(255,255,255,.04);
    border:1px solid var(--line2);
    font-size:9px;
    font-weight:650;
    transition:.15s;
}

.topButton:hover{
    color:#eee;
    background:rgba(255,255,255,.075);
}

/* MESSAGES */

.messages{
    flex:1;
    overflow:auto;
    padding:30px 18px 20px;
    scroll-behavior:smooth;
}

.messagesInner{
    width:min(920px,100%);
    margin:0 auto;
}

.welcome{
    min-height:calc(100vh - 190px);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    text-align:center;
    padding:40px 15px;
}

.welcomeOrb{
    position:relative;
    width:74px;
    height:74px;
    border-radius:24px;
    display:grid;
    place-items:center;
    background:
        radial-gradient(circle at 35% 25%,#303030,transparent 35%),
        linear-gradient(145deg,#1e1e1e,#070707);
    border:1px solid rgba(255,255,255,.12);
    box-shadow:
        0 25px 90px rgba(0,0,0,.6),
        inset 0 1px rgba(255,255,255,.1);
}

.welcomeOrb:before,
.welcomeOrb:after{
    content:"";
    position:absolute;
    inset:-9px;
    border-radius:28px;
    border:1px solid rgba(255,255,255,.035);
    animation:ring 3s linear infinite;
}

.welcomeOrb:after{
    inset:-18px;
    opacity:.45;
    animation-duration:5s;
}

@keyframes ring{
    from{transform:rotate(0)}
    to{transform:rotate(360deg)}
}

.welcomeN{
    font-size:29px;
    font-weight:900;
}

.welcome h1{
    margin:25px 0 8px;
    font-size:25px;
    letter-spacing:-.9px;
}

.welcome p{
    max-width:480px;
    margin:0;
    color:#5c5c5c;
    font-size:11px;
    line-height:1.7;
}

.suggestions{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:7px;
    margin-top:22px;
    max-width:600px;
}

.suggestion{
    padding:9px 11px;
    border-radius:10px;
    color:#777;
    background:rgba(255,255,255,.035);
    border:1px solid var(--line2);
    font-size:9px;
    transition:.15s;
}

.suggestion:hover{
    color:#ddd;
    background:rgba(255,255,255,.065);
}

/* MESSAGE ROW */

.message{
    display:flex;
    gap:11px;
    width:100%;
    margin:0 auto 27px;
    animation:messageIn .2s ease;
}

@keyframes messageIn{
    from{
        opacity:0;
        transform:translateY(5px);
    }
    to{
        opacity:1;
        transform:none;
    }
}

.message.user{
    justify-content:flex-end;
}

.messageAvatar{
    width:28px;
    height:28px;
    flex-shrink:0;
    display:grid;
    place-items:center;
    border-radius:9px;
    color:#bbb;
    background:#121212;
    border:1px solid var(--line);
    font-size:9px;
    font-weight:750;
}

.message.user .messageAvatar{
    display:none;
}

.messageBody{
    min-width:0;
    max-width:calc(100% - 40px);
}

.message.user .messageBody{
    max-width:min(730px,85%);
}

.messageHeader{
    display:flex;
    align-items:center;
    gap:7px;
    margin-bottom:6px;
    color:#505050;
    font-size:8px;
}

.message.user .messageHeader{
    justify-content:flex-end;
}

.messageModel{
    color:#3e3e3e;
}

.messageContent{
    color:#d4d4d4;
    font-size:12.5px;
    line-height:1.72;
    overflow-wrap:anywhere;
}

.message.user .messageContent{
    padding:10px 13px;
    border-radius:15px;
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.065);
    color:#e5e5e5;
}

.messageContent p{
    margin:0 0 10px;
}

.messageContent p:last-child{
    margin-bottom:0;
}

.messageContent h1,
.messageContent h2,
.messageContent h3{
    color:#eee;
    line-height:1.25;
}

.messageContent h1{
    font-size:20px;
}

.messageContent h2{
    font-size:17px;
}

.messageContent h3{
    font-size:14px;
}

.messageContent ul,
.messageContent ol{
    padding-left:20px;
}

.messageContent blockquote{
    margin:10px 0;
    padding:8px 12px;
    border-left:2px solid #444;
    color:#888;
    background:rgba(255,255,255,.025);
    border-radius:0 8px 8px 0;
}

.inlineCode{
    padding:2px 5px;
    border-radius:5px;
    color:#eee;
    background:#151515;
    border:1px solid rgba(255,255,255,.06);
    font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        monospace;
    font-size:.88em;
}

/* FILE CARD */

.fileCard{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:240px;
    max-width:440px;
    padding:10px;
    margin:5px 0 7px;
    border-radius:13px;
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.065),
            rgba(255,255,255,.025)
        );
    border:1px solid rgba(255,255,255,.08);
}

.fileIcon{
    width:35px;
    height:35px;
    flex-shrink:0;
    display:grid;
    place-items:center;
    border-radius:10px;
    background:#0b0b0b;
    border:1px solid rgba(255,255,255,.08);
    color:#bbb;
    font-size:9px;
    font-weight:800;
}

.fileInfo{
    min-width:0;
    flex:1;
}

.fileName{
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
    color:#ddd;
    font-size:10px;
    font-weight:650;
}

.fileMeta{
    margin-top:3px;
    color:#555;
    font-size:8px;
}

.imagePreview{
    display:block;
    width:min(500px,100%);
    max-height:400px;
    object-fit:contain;
    margin:5px 0;
    border-radius:14px;
    background:#080808;
    border:1px solid rgba(255,255,255,.08);
}

/* CODE */

.codeShell{
    width:100%;
    margin:13px 0;
    overflow:hidden;
    border-radius:13px;
    background:#050505;
    border:1px solid rgba(255,255,255,.085);
    box-shadow:
        0 15px 45px rgba(0,0,0,.25),
        inset 0 1px rgba(255,255,255,.025);
}

.codeTop{
    height:37px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 9px 0 12px;
    background:#090909;
    border-bottom:1px solid rgba(255,255,255,.06);
}

.codeLanguage{
    display:flex;
    align-items:center;
    gap:7px;
    color:#666;
    font-size:8px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.7px;
}

.codeDots{
    display:flex;
    gap:4px;
}

.codeDots i{
    width:5px;
    height:5px;
    border-radius:50%;
    background:#292929;
}

.codeActions{
    display:flex;
    gap:5px;
}

.codeBtn{
    height:25px;
    padding:0 8px;
    border-radius:7px;
    color:#777;
    background:#111;
    border:1px solid rgba(255,255,255,.06);
    font-size:8px;
    transition:.15s;
}

.codeBtn:hover{
    color:#eee;
    background:#181818;
}

.codePre{
    margin:0;
    padding:14px;
    overflow:auto;
    color:#d4d4d4;
    background:#050505;
    font-size:11px;
    line-height:1.65;
    tab-size:4;
}

.codePre code{
    font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        "Liberation Mono",
        monospace;
}

/* THINKING */

.thinking{
    display:flex;
    align-items:center;
    gap:10px;
    min-height:45px;
}

.thinkingOrb{
    position:relative;
    width:30px;
    height:30px;
    border-radius:10px;
    background:#0d0d0d;
    border:1px solid rgba(255,255,255,.09);
    overflow:hidden;
}

.thinkingOrb:before{
    content:"";
    position:absolute;
    width:20px;
    height:20px;
    left:5px;
    top:5px;
    border-radius:50%;
    background:radial-gradient(
        circle,
        #fff 0%,
        #777 14%,
        transparent 65%
    );
    filter:blur(1px);
    animation:thinkPulse 1.2s ease-in-out infinite;
}

.thinkingOrb:after{
    content:"";
    position:absolute;
    inset:-20px;
    border:1px solid rgba(255,255,255,.15);
    border-radius:50%;
    animation:thinkSpin 1.6s linear infinite;
}

@keyframes thinkPulse{
    0%,100%{
        transform:scale(.5);
        opacity:.3;
    }
    50%{
        transform:scale(1.15);
        opacity:1;
    }
}

@keyframes thinkSpin{
    from{
        transform:rotate(0deg);
    }
    to{
        transform:rotate(360deg);
    }
}

.thinkingText{
    display:flex;
    flex-direction:column;
    gap:3px;
}

.thinkingTitle{
    color:#aaa;
    font-size:10px;
    font-weight:650;
}

.thinkingSub{
    color:#454545;
    font-size:8px;
}

.thinkingDots{
    display:inline-flex;
    gap:3px;
    margin-left:2px;
}

.thinkingDots span{
    width:3px;
    height:3px;
    border-radius:50%;
    background:#777;
    animation:dot 1s infinite;
}

.thinkingDots span:nth-child(2){
    animation-delay:.15s;
}

.thinkingDots span:nth-child(3){
    animation-delay:.3s;
}

@keyframes dot{
    0%,70%,100%{
        opacity:.2;
        transform:translateY(0);
    }
    35%{
        opacity:1;
        transform:translateY(-2px);
    }
}

/* COMPOSER */

.composerArea{
    flex-shrink:0;
    padding:8px 18px 17px;
    background:
        linear-gradient(
            to top,
            rgba(3,3,3,.97) 50%,
            rgba(3,3,3,.45),
            transparent
        );
}

.composer{
    position:relative;
    width:min(920px,100%);
    margin:0 auto;
    border-radius:18px;
    background:rgba(14,14,14,.78);
    border:1px solid rgba(255,255,255,.095);
    box-shadow:
        0 18px 65px rgba(0,0,0,.4),
        inset 0 1px rgba(255,255,255,.035);
    backdrop-filter:blur(28px);
    -webkit-backdrop-filter:blur(28px);
    transition:.2s;
}

.composer.drag{
    border-color:rgba(255,255,255,.28);
    box-shadow:
        0 0 0 1px rgba(255,255,255,.08),
        0 0 60px rgba(255,255,255,.05);
}

#prompt{
    display:block;
    width:100%;
    min-height:57px;
    max-height:220px;
    padding:15px 15px 8px;
    resize:none;
    outline:none;
    border:0;
    background:transparent;
    color:#eee;
    font-size:12px;
    line-height:1.55;
}

#prompt::placeholder{
    color:#4d4d4d;
}

.attachmentBar{
    display:none;
    padding:8px 9px 0;
}

.attachmentBar.show{
    display:block;
}

.attachment{
    display:flex;
    align-items:center;
    gap:8px;
    width:max-content;
    max-width:100%;
    padding:6px 8px;
    border-radius:9px;
    color:#aaa;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.06);
}

.attachmentIcon{
    width:23px;
    height:23px;
    display:grid;
    place-items:center;
    border-radius:6px;
    color:#aaa;
    background:#0c0c0c;
    font-size:7px;
    font-weight:800;
}

.attachmentName{
    max-width:300px;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
    font-size:9px;
}

.removeAttachment{
    color:#555;
    background:transparent;
    font-size:13px;
}

.composerBottom{
    height:42px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 8px 8px 8px;
}

.composerLeft{
    display:flex;
    align-items:center;
    gap:3px;
}

.iconButton{
    width:29px;
    height:29px;
    display:grid;
    place-items:center;
    border-radius:9px;
    color:#666;
    background:transparent;
    font-size:14px;
}

.iconButton:hover{
    color:#ddd;
    background:rgba(255,255,255,.055);
}

.sendButton{
    width:31px;
    height:31px;
    display:grid;
    place-items:center;
    border-radius:10px;
    color:#050505;
    background:#eee;
    font-size:13px;
    font-weight:900;
    transition:.15s;
}

.sendButton:hover{
    background:#fff;
    transform:translateY(-1px);
}

.sendButton.stop{
    color:#eee;
    background:#191919;
    border:1px solid rgba(255,255,255,.12);
}

.hint{
    margin-top:7px;
    text-align:center;
    color:#353535;
    font-size:7px;
}

/* MODAL */

.modal{
    position:fixed;
    inset:0;
    z-index:100;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(0,0,0,.65);
    backdrop-filter:blur(15px);
    -webkit-backdrop-filter:blur(15px);
}

.modal.show{
    display:flex;
}

.modalBox{
    width:min(420px,100%);
    padding:18px;
    border-radius:20px;

/* ==========================================================

/* ==========================================================
   HELPERS
========================================================== */

function uid(){

    return (
        Date.now().toString(36) +
        Math.random()
            .toString(36)
            .slice(2,9)
    );

}

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

function parseJSON(value,fallback){

    try{
        return JSON.parse(value);
    }catch{
        return fallback;
    }

}

function formatTime(timestamp){

    try{

        return new Date(timestamp)
            .toLocaleTimeString([],{
                hour:"2-digit",
                minute:"2-digit"
            });

    }catch{

        return "";

    }

}

function selectedModel(){

    return MODELS[
        modelSelect.value
    ] || MODELS["claude-opus-4.7"];

}

function apiKey(){

    return (
        localStorage
            .getItem(STORAGE.key) ||
        ""
    ).trim();

}

function toast(text){

    const box =
        document.createElement("div");

    box.className =

    $("toastContainer")
        .appendChild(box);

    setTimeout(()=>{

/* ==========================================================
   STORAGE
========================================================== */

function save(){

    localStorage.setItem(
        STORAGE.chats,
        JSON.stringify(chats)
    );

}

function load(){

    const stored =
        parseJSON(
            localStorage.getItem(
                STORAGE.chats
            ),
            []
        );

    chats =
        Array.isArray(stored)
            ? stored
            : [];

    const savedProfile =
        parseJSON(
            localStorage.getItem(
                STORAGE.profile
            ),
            null
        );

    if(savedProfile){

        profile.name =
            savedProfile.name ||
            "Nezzx";

        profile.avatar =
            savedProfile.avatar ||
            "";

    }

    const savedModel =
        localStorage.getItem(
            STORAGE.model
        );

    if(
        savedModel &&
        MODELS[savedModel]
    ){

        modelSelect.value =
            savedModel;

    }else{

        modelSelect.value =
            "claude-opus-4.7";

    }

    const savedCurrent =
        localStorage.getItem(
            STORAGE.current
        );

    if(
        savedCurrent &&
        chats.some(
            chat =>
                chat.id === savedCurrent
        )
    ){

        currentChatId =
            savedCurrent;

    }else if(chats.length){

        currentChatId =
            chats[0].id;

    }

    updateProfile();

}


/* ==========================================================
   CHAT
========================================================== */

function createChat(){

    const chat = {
        id:uid(),
        title:"New chat",
        createdAt:Date.now(),
        updatedAt:Date.now(),
        messages:[]
    };

    chats.unshift(chat);

    currentChatId =
        chat.id;

    localStorage.setItem(
        STORAGE.current,
        currentChatId
    );

    save();

    renderHistory();
    renderChat();

    return chat;

}

function currentChat(){

    let chat =
        chats.find(
            item =>
                item.id ===
                currentChatId
        );

    if(!chat){

        chat =
            createChat();

    }

    return chat;

}

function titleFor(chat){

    const msg =
        (chat.messages || [])
            .find(
                item =>
                    item.role === "user"
            );

    if(!msg)
        return "New chat";

    let text =
        typeof msg.content === "string"
            ? msg.content
            : "Attached file";

    text =
        text
            .replace(/\s+/g," ")
            .trim();

    return text.length > 45
        ? text.slice(0,45) + "…"
        : text || "New chat";

}

function touchChat(chat){

    chat.updatedAt =
        Date.now();

    chat.title =
        titleFor(chat);

    chats.sort(
        (a,b) =>
            (b.updatedAt || 0) -
            (a.updatedAt || 0)
    );

    save();

    localStorage.setItem(
        STORAGE.current,
        currentChatId
    );

    renderHistory();

}


/* ==========================================================
   HISTORY
========================================================== */

function renderHistory(){

    historyList.innerHTML = "";

    if(!chats.length){

        historyList.innerHTML = `
            <div style="
                padding:10px 5px;
                color:#444;
                font-size:9px;
            ">
                No conversations
            </div>
        `;

        return;

    }

    chats.forEach(chat=>{

        const button =
            document.createElement("button");

        button.className =
            "chatItem" +
            (
                chat.id === currentChatId
                    ? " active"
                    : ""
            );

        button.innerHTML = `
            <div class="chatTitle">
                ${escapeHTML(
                    chat.title ||
                    titleFor(chat)
                )}
            </div>

            <div class="chatTime">
                ${formatTime(
                    chat.updatedAt
                )}
            </div>
        `;

        button.onclick = ()=>{

            currentChatId =
                chat.id;

            localStorage.setItem(
                STORAGE.current,
                currentChatId
            );

            renderHistory();
            renderChat();

            sidebar.classList.remove(
                "open"
            );

        };

        historyList.appendChild(
            button
        );

    });

}


/* ==========================================================
   MARKDOWN
========================================================== */

function markdown(text){

    if(!text)
        return "";

    let source =
        String(text);

    const blocks = [];

    source =
        source.replace(
            /```([^\n`]*)\n?([\s\S]*?)```/g,
            (_,language,code)=>{

                const index =
                    blocks.length;

                blocks.push({
                    language:
                        language.trim() ||
                        "code",

                    code:
                        code
                            .replace(/\n$/,"")
                });

                return (
                    "\n@@CODE_" +
                    index +
                    "@@\n"
                );

            }
        );

    source =
        escapeHTML(source);

    source =
        source.replace(
            /`([^`\n]+)`/g,
            '<span class="inlineCode">$1</span>'
        );

    source =
        source.replace(
            /\*\*([^*]+)\*\*/g,
            "<strong>$1</strong>"
        );

    source =
        source.replace(
            /^### (.+)$/gm,
            "<h3>$1</h3>"
        );

    source =
        source.replace(
            /^## (.+)$/gm,
            "<h2>$1</h2>"
        );

    source =
        source.replace(
            /^# (.+)$/gm,
            "<h1>$1</h1>"
        );

    source =
        source.replace(
            /^> (.+)$/gm,
            "<blockquote>$1</blockquote>"
        );

    source =
        source.replace(
            /^\s*[-*] (.+)$/gm,
            "<li>$1</li>"
        );

    source =
        source.replace(
            /\n/g,
            "<br>"
        );

    source =
        source.replace(
            /(<li>.*?<\/li>)(?:<br>)?/g,
            "$1"
        );

    source =
        source.replace(
            /@@CODE_(\d+)@@/g,
            (_,index)=>{

                const block =
                    blocks[
                        Number(index)
                    ];

                const encoded =
                    encodeURIComponent(
                        block.code
                    );

                return `
                    <div class="codeShell">

                        <div class="codeTop">

                            <div class="codeLanguage">

                                <span class="codeDots">
                                    <i></i>
                                    <i></i>
                                    <i></i>
                                </span>

                                ${escapeHTML(
                                    block.language
                                )}

                            </div>

                            <div class="codeActions">

                                <button
                                    class="codeBtn"
                                    data-copy="${encoded}"
                                >
                                    Copy
                                </button>

                                <button
                                    class="codeBtn"
                                    data-download="${encoded}"
                                    data-language="${escapeHTML(
                                        block.language
                                    )}"
                                >
                                    Download
                                </button>

                            </div>

                        </div>

                        <pre class="codePre"><code>${escapeHTML(
                            block.code
                        )}</code></pre>

                    </div>
                `;

            }
        );

    return source;

}


/* ==========================================================
   CODE ACTIONS
========================================================== */

function bindCodeActions(root){

    root
        .querySelectorAll(
            "[data-copy]"
        )
        .forEach(button=>{

            button.onclick =
                async ()=>{

                    const code =
                        decodeURIComponent(
                            button.dataset.copy
                        );

                    try{

                        await navigator
                            .clipboard
                            .writeText(code);

                        const old =
                            button.textContent;

                        button.textContent =
                            "Copied";

                        setTimeout(()=>{

                            button.textContent =
                                old;

                        },1000);

                    }catch{

                        toast(
                            "Could not copy code"
                        );

                    }

                };

        });


    root
        .querySelectorAll(
            "[data-download]"
        )
        .forEach(button=>{

            button.onclick = ()=>{

                const code =
                    decodeURIComponent(
                        button.dataset.download
                    );

                const language =
                    (
                        button.dataset.language ||
                        "code"
                    )
                    .toLowerCase();

                const extensionMap = {
                    javascript:"js",
                    js:"js",
                    typescript:"ts",
                    ts:"ts",
                    html:"html",
                    css:"css",
                    lua:"lua",
                    luau:"luau",
                    python:"py",
                    py:"py",
                    json:"json",
                    xml:"xml",
                    cpp:"cpp",
                    c:"c",
                    csharp:"cs",
                    "c#":"cs",
                    java:"java",
                    rust:"rs",
                    go:"go",
                    php:"php",
                    sql:"sql",
                    bash:"sh",
                    shell:"sh",
                    markdown:"md",
                    md:"md"
                };

                const extension =
                    extensionMap[
                        language
                    ] || "txt";

                let filename =
                    "nzx-code." +
                    extension;

                const blob =
                    new Blob(
                        [code],
                        {
                            type:
                                "text/plain;charset=utf-8"
                        }
                    );

                const url =
                    URL.createObjectURL(
                        blob
                    );

                const a =
                    document.createElement(
                        "a"
                    );

                a.href = url;
                a.download = filename;

                document.body.appendChild(a);

                a.click();

                a.remove();

                setTimeout(
                    ()=>URL.revokeObjectURL(url),
                    500
                );

            };

        });

}


/* ==========================================================
   FILE CARD
========================================================== */

function fileExtension(name){

    const part =
        name
            .split(".")
            .pop();

    return (
        part ||
        "FILE"
    )
    .slice(0,5)
    .toUpperCase();

}

function fileSize(bytes){

    if(bytes < 1024)
        return bytes + " B";

    if(bytes < 1024 * 1024)
        return (
            (bytes / 1024)
                .toFixed(1)
        ) + " KB";

    return (
        (bytes / 1024 / 1024)
            .toFixed(1)
    ) + " MB";

}

function fileCard(file){

    if(!file)
        return "";

    if(file.type &&
       file.type.startsWith("image/")){

        return `
            <img
                class="imagePreview"
                src="${escapeHTML(
                    file.data
                )}"
                alt="${escapeHTML(
                    file.name
                )}"
            >
        `;

    }

/* ==========================================================
   FILE READER
========================================================== */

function readFile(file){

    return new Promise(
        (resolve,reject)=>{

            const reader =
                new FileReader();

            reader.onload =
                ()=>resolve(
                    reader.result
                );

            reader.onerror =
                reject;

            if(
                file.type.startsWith(
                    "image/"
                )
            ){

                reader.readAsDataURL(
                    file
                );

            }else{

                reader.readAsText(
                    file
                );

            }

        }
    );

}

async function buildUserContent(){

    const text =
        prompt.value.trim();

    if(!attachedFile){

        return {
            apiContent:
                text,

            savedText:
                text,

            attachment:null
        };

    }

    const file =
        attachedFile;

    const data =
        await readFile(file);

    if(
        file.type.startsWith(
            "image/"
        )
    ){

        return {

            apiContent:[
                {
                    type:"text",
                    text:
                        text ||
                        "Analyze this image."
                },

                {
                    type:"image_url",
                    image_url:{
                        url:data
                    }
                }
            ],

            savedText:
                text,

            attachment:{
                name:file.name,
                mime:file.type,
                type:"image",
                data:data
            }

        };

    }

    return {

        apiContent:
`${text || "Analyze this file."}

Attached file: ${file.name}

--- FILE START ---
${String(data).slice(0,150000)}
--- FILE END ---`,

        savedText:
            text,

        attachment:{
            name:file.name,
            mime:file.type,
            type:"text",
            data:String(data).slice(0,50000)
        }

    };

}

async function getAvailableModels(){

    const key =
        apiKey();

    if(!key)
        return null;

    try{

        const response =
            await fetch(
                API_BASE +
                "/models",
                {
                    headers:{
                        Authorization:
                            "Bearer " +
                            key
                    }
                }
            );

        if(!response.ok)
            return null;

        const data =
            await response.json();

        return Array.isArray(
            data.data
        )
            ? data.data
            : Array.isArray(data)
                ? data
                : null;

    }catch{

        return null;

    }

}

async function verifySelectedModel(){

    const models =
        await getAvailableModels();

    /*
     * If /models cannot be checked,
     * let the completion endpoint decide.
     */

    if(!models)
        return true;

    const model =
        selectedModel();

    const exists =
        models.some(
            item =>
                item.id === model.id
        );

    if(!exists){

        throw new Error(
            `Model "${model.id}" is not available for this API key.`
        );

    }

    return true;

}


/* ==========================================================
   API STREAM
========================================================== */

async function requestAI(
    apiMessages,
    onToken
){

    const key =
        apiKey();

    if(!key){

        throw new Error(
            "No API key. Open Link Key and connect your Clean APIs key."
        );

    }

    await verifySelectedModel();

    controller =
        new AbortController();

    const model =
        selectedModel();

    const response =
        await fetch(
            CHAT_ENDPOINT,
            {
                method:"POST",

                headers:{
                    "Content-Type":
                        "application/json",

                    "Authorization":
                        "Bearer " +
                        key
                },

                body:
                    JSON.stringify({

                        model:model.id,

                        messages:
                            apiMessages,

                        stream:true,

                        temperature:.25,

                        max_tokens:16000

                    }),

                signal:
                    controller.signal
            }
        );

    if(!response.ok){

        const raw =
            await response.text();

        const parsed =
            parseJSON(
                raw,
                null
            );

        const message =
            parsed?.error?.message ||
            raw ||
            `HTTP ${response.status}`;

        throw new Error(
            message
        );

    }

    if(!response.body){

        const data =
            await response.json();

        const text =
            data?.choices?.[0]
                ?.message
                ?.content ||
            "";

        if(text)
            onToken(text);

        return text;

    }

    const reader =
        response.body.getReader();

    const decoder =
        new TextDecoder();

    let buffer = "";
    let result = "";

    while(true){

        const {
            value,
            done
        } =
            await reader.read();

        if(done)
            break;

        buffer +=
            decoder.decode(
                value,
                {
                    stream:true
                }
            );

        const lines =
            buffer.split("\n");

        buffer =
            lines.pop() || "";

        for(
            const rawLine
            of lines
        ){

            const line =
                rawLine.trim();

            if(
                !line ||
                line.startsWith(":")
            )
                continue;

            if(
                !line.startsWith(
                    "data:"
                )
            )
                continue;

            const dataText =
                line
                    .slice(5)
                    .trim();

            if(
                dataText ===
                "[DONE]"
            )
                continue;

            const data =
                parseJSON(
                    dataText,
                    null
                );

            if(!data)
                continue;

            const delta =
                data
                    ?.choices?.[0]
                    ?.delta
                    ?.content;

            if(
                typeof delta ===
                "string"
            ){

                result +=
                    delta;

                onToken(
                    delta
                );

            }

        }

    }

    return result;

}


/* ==========================================================
   SEND
========================================================== */

async function send(){

    if(generating){

        stop();

        return;

    }

    const text =
        prompt.value.trim();

    if(
        !text &&
        !attachedFile
    )
        return;

    if(!apiKey()){

        $("apiModal")
            .classList.add(
                "show"
            );

        toast(
            "Connect your API key first"
        );

        return;

    }

    const chat =
        currentChat();

    let built;

    try{

        built =
            await buildUserContent();

    }catch{

        toast(
            "Could not read the file"
        );

        return;

    }

    chat.messages.push({

        role:"user",

        content:
            built.savedText,

        attachment:
            built.attachment

    });

    touchChat(chat);

    prompt.value = "";

    resizePrompt();

    attachedFile = null;

    fileInput.value = "";

    attachmentBar.classList.remove(
        "show"
    );

    renderChat();

    const thinking =
        createThinking();

    generating = true;

    sendButton.classList.add(
        "stop"
    );

    sendButton.textContent =
        "■";

    let assistantText = "";

    try{

        const apiMessages = [

            {
                role:"system",
                content:
                    SYSTEM_PROMPT
            },

            ...chat.messages.map(
                message=>({

                    role:
                        message.role,

                    content:
                        message.role ===
                        "user" &&
                        message ===
                        chat.messages[
                            chat.messages.length - 1
                        ]
                            ? built.apiContent
                            : message.content

                })
            )

        ];

        /*
         * Remove thinking animation only when
         * actual content starts.
         */

        let assistantRow =
            null;

        await requestAI(
            apiMessages,
            token=>{

                if(!assistantRow){

                    thinking.remove();

                    assistantRow =
                        document.createElement(
                            "div"
                        );

                    assistantRow.className =
                        "message assistant";

                    assistantRow.innerHTML = `
                        <div class="messageAvatar">
                            N
                        </div>

                        <div class="messageBody">

                            <div class="messageHeader">

                                <span>Nyx</span>

                                <span class="messageModel">
                                    ${escapeHTML(
                                        selectedModel()
                                            .label
                                    )}
                                </span>

                            </div>

                            <div class="messageContent"></div>

                        </div>
                    `;

                    messagesInner.appendChild(
                        assistantRow
                    );

                }

                assistantText +=
                    token;

                updateStreaming(
                    assistantRow,
                    assistantText
                );

                scrollBottom();

            }
        );

        if(!assistantText.trim()){

            assistantText =
                "The model returned an empty response.";

            if(!assistantRow){

                thinking.remove();

                assistantRow =
                    document.createElement(
                        "div"
                    );

                assistantRow.className =
                    "message assistant";

                assistantRow.innerHTML = `
                    <div class="messageAvatar">
                        N
                    </div>

                    <div class="messageBody">

                        <div class="messageHeader">
                            <span>Nyx</span>
                        </div>

                        <div class="messageContent"></div>

                    </div>
                `;

                messagesInner.appendChild(
                    assistantRow
                );

            }

            updateStreaming(
                assistantRow,
                assistantText
            );

        }

        chat.messages.push({

            role:"assistant",

            content:
                assistantText,

            model:
                selectedModel()
                    .label

        });

        touchChat(chat);

    }catch(error){

        thinking.remove();

        if(
            error?.name ===
            "AbortError"
        ){

            if(
                assistantText.trim()
            ){

                chat.messages.push({

                    role:"assistant",

                    content:
                        assistantText +
                        "\n\n_Generation stopped._",

                    model:
                        selectedModel()
                            .label

                });

                touchChat(chat);

            }

        }else{

            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "message assistant";

            row.innerHTML = `
                <div class="messageAvatar">
                    N
                </div>

                <div class="messageBody">

                    <div class="messageHeader">
                        <span>Nyx</span>
                    </div>

                    <div class="messageContent">
                        <strong>Request failed</strong>
                        <p>${escapeHTML(
                            error?.message ||
                            "Unknown error"
                        )}</p>
                    </div>

                </div>
            `;

            messagesInner.appendChild(
                row
            );

            toast(
                error?.message ||
                "Request failed"
            );

        }

    }finally{

        controller = null;

        generating = false;

        sendButton.classList.remove(
            "stop"
        );

        sendButton.textContent =
            "↑";

        renderHistory();

        scrollBottom();

    }

}

/* ==========================================================
   BACKGROUND PARTICLES
========================================================== */

const canvas =
    $("stars");

const ctx =
    canvas.getContext(
        "2d"
    );

let particles = [];

function resizeCanvas(){

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    canvas.width =
        innerWidth * dpr;

    canvas.height =
        innerHeight * dpr;

    canvas.style.width =
        innerWidth + "px";

    canvas.style.height =
        innerHeight + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    particles = [];

    const count =
        Math.min(
            170,
            Math.max(
                65,
                Math.floor(
                    innerWidth *
                    innerHeight /
                    10000
                )
            )
        );

    for(let i=0;i<count;i++){

        particles.push({

            x:
                Math.random() *
                innerWidth,

            y:
                Math.random() *
                innerHeight,

            r:
                Math.random() *
                1.2 +
                .15,

            a:
                Math.random() *
                .5 +
                .08,

            speed:
                Math.random() *
                .18 +
                .03,

            phase:
                Math.random() *
                Math.PI *
                2

        });

    }

}

function drawBackground(time){

    ctx.clearRect(
        0,
        0,
        innerWidth,
        innerHeight
    );

    for(
        const p of particles
    ){

        p.y -=
            p.speed;

        if(p.y < -5)
            p.y =
                innerHeight + 5;

        const alpha =
            p.a +
            Math.sin(
                time * .001 +
                p.phase
            ) * .12;

        ctx.globalAlpha =
            Math.max(
                .02,
                alpha
            );

        ctx.fillStyle =
            "#fff";

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.r,
            0,
            Math.PI * 2
        );

        ctx.fill();

    }

    ctx.globalAlpha = 1;

    requestAnimationFrame(
        drawBackground
    );

}

window.addEventListener(
    "resize",
    resizeCanvas
);


/* ==========================================================
   INIT
========================================================== */

load();

if(!chats.length){

    createChat();

}else{

    renderHistory();

    renderChat();

}

updateKeyStatus();

resizePrompt();

resizeCanvas();

requestAnimationFrame(
    drawBackground
);

</script>
