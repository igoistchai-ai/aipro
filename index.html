<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#050505">
<title>NZX AI — Coding Chat</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050505;
    color:#f5f5f5;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",
    Inter,Segoe UI,Arial,sans-serif;
}

body{
    position:relative;
}

button,
input,
textarea,
select{
    font:inherit;
}

button{
    border:0;
    cursor:pointer;
}

#saturn{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
    z-index:0;
    opacity:.62;
}

#app{
    position:relative;
    z-index:2;
    display:flex;
    width:100%;
    height:100%;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
    width:265px;
    height:100%;
    padding:16px;
    border-right:1px solid rgba(255,255,255,.075);
    background:rgba(10,10,10,.56);
    backdrop-filter:blur(28px) saturate(120%);
    -webkit-backdrop-filter:blur(28px) saturate(120%);
    display:flex;
    flex-direction:column;
    gap:14px;
    flex-shrink:0;
    transition:.25s ease;
}

.brand{
    display:flex;
    align-items:center;
    gap:11px;
    padding:4px 5px 12px;
}

.logo{
    width:38px;
    height:38px;
    border-radius:12px;
    display:grid;
    place-items:center;
    font-size:17px;
    font-weight:800;
    background:linear-gradient(145deg,#202020,#0b0b0b);
    border:1px solid rgba(255,255,255,.13);
    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.08),
        0 10px 30px rgba(0,0,0,.35);
}

.brandText{
    min-width:0;
}

.brandName{
    font-size:14px;
    font-weight:700;
    letter-spacing:.1px;
}

.brandSub{
    margin-top:2px;
    font-size:10px;
    color:#747474;
}

.newChat{
    width:100%;
    height:42px;
    border-radius:13px;
    color:#fff;
    background:rgba(255,255,255,.075);
    border:1px solid rgba(255,255,255,.09);
    transition:.18s ease;
    font-size:12px;
    font-weight:600;
}

.newChat:hover{
    background:rgba(255,255,255,.12);
    transform:translateY(-1px);
}

.newChat:active{
    transform:scale(.98);
}

.history{
    flex:1;
    overflow:auto;
    padding-right:2px;
}

.history::-webkit-scrollbar,
.chatMessages::-webkit-scrollbar,
textarea::-webkit-scrollbar{
    width:4px;
}

.history::-webkit-scrollbar-thumb,
.chatMessages::-webkit-scrollbar-thumb,
textarea::-webkit-scrollbar-thumb{
    background:rgba(255,255,255,.12);
    border-radius:10px;
}

.historyTitle{
    margin:4px 5px 8px;
    font-size:9px;
    color:#5f5f5f;
    text-transform:uppercase;
    letter-spacing:1.2px;
}

.chatItem{
    width:100%;
    padding:10px 11px;
    margin-bottom:4px;
    border-radius:11px;
    background:transparent;
    border:1px solid transparent;
    color:#aaa;
    text-align:left;
    transition:.16s ease;
    overflow:hidden;
}

.chatItem:hover{
    background:rgba(255,255,255,.045);
    color:#ddd;
}

.chatItem.active{
    background:rgba(255,255,255,.075);
    border-color:rgba(255,255,255,.08);
    color:#fff;
}

.chatItemTitle{
    font-size:11px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.chatItemTime{
    margin-top:3px;
    font-size:8px;
    color:#555;
}

.profileCard{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px;
    border-radius:14px;
    border:1px solid rgba(255,255,255,.07);
    background:rgba(255,255,255,.035);
    cursor:pointer;
}

.avatar{
    width:34px;
    height:34px;
    flex-shrink:0;
    border-radius:50%;
    overflow:hidden;
    display:grid;
    place-items:center;
    background:linear-gradient(135deg,#252525,#101010);
    border:1px solid rgba(255,255,255,.1);
    color:#fff;
    font-size:12px;
    font-weight:700;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.profileInfo{
    min-width:0;
    flex:1;
}

.profileName{
    font-size:11px;
    font-weight:600;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.profileSub{
    margin-top:2px;
    color:#666;
    font-size:9px;
}

/* =========================
   MAIN
========================= */

.main{
    flex:1;
    min-width:0;
    height:100%;
    display:flex;
    flex-direction:column;
}

.topbar{
    height:62px;
    padding:10px 17px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid rgba(255,255,255,.065);
    background:rgba(5,5,5,.28);
    backdrop-filter:blur(22px);
    -webkit-backdrop-filter:blur(22px);
}

.topLeft{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:0;
}

.mobileMenu{
    display:none;
    width:34px;
    height:34px;
    border-radius:10px;
    color:#aaa;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.07);
}

.modelWrap{
    display:flex;
    align-items:center;
    gap:8px;
}

.modelDot{
    width:6px;
    height:6px;
    border-radius:50%;
    background:#fff;
    box-shadow:0 0 12px rgba(255,255,255,.7);
}

#modelSelect{
    appearance:none;
    -webkit-appearance:none;
    color:#eee;
    background:rgba(255,255,255,.055);
    border:1px solid rgba(255,255,255,.085);
    outline:0;
    border-radius:10px;
    height:36px;
    padding:0 31px 0 11px;
    font-size:11px;
    font-weight:600;
    cursor:pointer;
}

#modelSelect option{
    background:#111;
    color:#fff;
}

.topActions{
    display:flex;
    align-items:center;
    gap:7px;
}

.topBtn{
    height:36px;
    padding:0 12px;
    border-radius:10px;
    color:#aaa;
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.07);
    font-size:10px;
    font-weight:600;
    transition:.16s ease;
}

.topBtn:hover{
    color:#fff;
    background:rgba(255,255,255,.08);
}

.chatMessages{
    flex:1;
    overflow:auto;
    padding:34px 18px 20px;
}

.chatInner{
    width:min(900px,100%);
    margin:0 auto;
}

.emptyState{
    min-height:calc(100vh - 180px);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:30px;
}

.emptyLogo{
    width:62px;
    height:62px;
    border-radius:20px;
    display:grid;
    place-items:center;
    font-size:27px;
    font-weight:800;
    background:linear-gradient(145deg,#252525,#090909);
    border:1px solid rgba(255,255,255,.12);
    box-shadow:0 20px 60px rgba(0,0,0,.4);
}

.emptyState h1{
    margin:18px 0 7px;
    font-size:24px;
    letter-spacing:-.7px;
}

.emptyState p{
    margin:0;
    max-width:420px;
    line-height:1.6;
    font-size:12px;
    color:#686868;
}

.message{
    display:flex;
    gap:11px;
    margin:0 auto 25px;
    max-width:850px;
}

.message.user{
    justify-content:flex-end;
}

.messageAvatar{
    width:28px;
    height:28px;
    border-radius:9px;
    flex-shrink:0;
    display:grid;
    place-items:center;
    font-size:9px;
    font-weight:700;
    background:rgba(255,255,255,.065);
    border:1px solid rgba(255,255,255,.08);
}

.message.user .messageAvatar{
    order:2;
}

.messageContent{
    min-width:0;
    max-width:calc(100% - 40px);
}

.message.user .messageContent{
    max-width:min(720px,82%);
}

.messageRole{
    margin-bottom:5px;
    color:#666;
    font-size:9px;
}

.message.user .messageRole{
    text-align:right;
}

.messageBubble{
    color:#d9d9d9;
    font-size:13px;
    line-height:1.65;
    overflow-wrap:anywhere;
}

.message.user .messageBubble{
    padding:10px 13px;
    border-radius:15px;
    background:rgba(255,255,255,.075);
    border:1px solid rgba(255,255,255,.075);
    color:#eee;
}

.messageBubble p{
    margin:0 0 10px;
}

.messageBubble p:last-child{
    margin-bottom:0;
}

.messageBubble ul,
.messageBubble ol{
    margin:8px 0;
    padding-left:21px;
}

.messageBubble blockquote{
    margin:10px 0;
    padding-left:12px;
    border-left:2px solid #444;
    color:#999;
}

.inlineCode{
    padding:2px 5px;
    border-radius:5px;
    background:rgba(255,255,255,.07);
    color:#eee;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:.9em;
}

.codeBlock{
    margin:12px 0;
    border-radius:12px;
    overflow:hidden;
    border:1px solid rgba(255,255,255,.08);
    background:#080808;
}

.codeHeader{
    height:32px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 9px 0 11px;
    color:#666;
    background:rgba(255,255,255,.025);
    border-bottom:1px solid rgba(255,255,255,.06);
    font-size:9px;
}

.copyCode{
    color:#999;
    background:transparent;
    font-size:9px;
}

.copyCode:hover{
    color:#fff;
}

.codeBlock pre{
    margin:0;
    padding:13px;
    overflow:auto;
    font-size:11px;
    line-height:1.6;
    color:#ddd;
    font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
}

.codeBlock code{
    font-family:inherit;
}

.typing{
    display:inline-flex;
    gap:4px;
    align-items:center;
    padding:5px 0;
}

.typing span{
    width:5px;
    height:5px;
    border-radius:50%;
    background:#777;
    animation:typing 1s infinite;
}

.typing span:nth-child(2){animation-delay:.13s}
.typing span:nth-child(3){animation-delay:.26s}

@keyframes typing{
    0%,70%,100%{opacity:.2;transform:translateY(0)}
    35%{opacity:1;transform:translateY(-2px)}
}

/* =========================
   COMPOSER
========================= */

.composerArea{
    padding:9px 18px 17px;
    background:linear-gradient(
        to top,
        rgba(5,5,5,.93) 55%,
        rgba(5,5,5,.45),
        transparent
    );
}

.composer{
    width:min(900px,100%);
    margin:auto;
    position:relative;
    border:1px solid rgba(255,255,255,.095);
    border-radius:18px;
    background:rgba(15,15,15,.72);
    backdrop-filter:blur(28px) saturate(125%);
    -webkit-backdrop-filter:blur(28px) saturate(125%);
    box-shadow:
        0 15px 50px rgba(0,0,0,.32),
        inset 0 1px 0 rgba(255,255,255,.035);
}

.attachPreview{
    display:none;
    padding:9px 11px 0;
}

.attachPreview.show{
    display:flex;
}

.attachmentChip{
    max-width:100%;
    display:flex;
    align-items:center;
    gap:7px;
    padding:6px 8px;
    border-radius:8px;
    background:rgba(255,255,255,.06);
    color:#aaa;
    font-size:9px;
}

.removeAttach{
    color:#666;
    background:transparent;
}

#prompt{
    display:block;
    width:100%;
    min-height:54px;
    max-height:220px;
    resize:none;
    padding:15px 15px 8px;
    border:0;
    outline:0;
    background:transparent;
    color:#eee;
    font-size:13px;
    line-height:1.5;
}

#prompt::placeholder{
    color:#555;
}

.composerBottom{
    height:42px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 8px 8px 9px;
}

.composerLeft{
    display:flex;
    align-items:center;
    gap:4px;
}

.iconBtn{
    width:29px;
    height:29px;
    display:grid;
    place-items:center;
    border-radius:9px;
    color:#666;
    background:transparent;
    font-size:15px;
    transition:.15s ease;
}

.iconBtn:hover{
    color:#ddd;
    background:rgba(255,255,255,.06);
}

.sendBtn{
    width:31px;
    height:31px;
    border-radius:10px;
    display:grid;
    place-items:center;
    color:#090909;
    background:#eee;
    font-size:14px;
    font-weight:800;
    transition:.15s ease;
}

.sendBtn:hover{
    transform:translateY(-1px);
    background:#fff;
}

.sendBtn.stop{
    color:#fff;
    background:#242424;
    border:1px solid rgba(255,255,255,.1);
}

.footerHint{
    margin-top:7px;
    text-align:center;
    font-size:8px;
    color:#3f3f3f;
}

/* =========================
   MODALS
========================= */

.modal{
    position:fixed;
    inset:0;
    z-index:50;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(0,0,0,.57);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
}

.modal.show{
    display:flex;
}

.modalBox{
    width:min(420px,100%);
    border-radius:20px;
    padding:18px;
    background:rgba(17,17,17,.92);
    border:1px solid rgba(255,255,255,.1);
    box-shadow:0 30px 100px rgba(0,0,0,.6);
    animation:modalIn .18s ease;
}

@keyframes modalIn{
    from{
        opacity:0;
        transform:translateY(8px) scale(.98);
    }
    to{
        opacity:1;
        transform:none;
    }
}

.modalHeader{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:18px;
}

.modalTitle{
    font-size:14px;
    font-weight:700;
}

.closeModal{
    width:28px;
    height:28px;
    border-radius:9px;
    color:#777;
    background:rgba(255,255,255,.05);
}

.formLabel{
    display:block;
    margin:0 0 7px;
    color:#777;
    font-size:9px;
    text-transform:uppercase;
    letter-spacing:.8px;
}

.modalInput{
    width:100%;
    height:40px;
    padding:0 11px;
    border-radius:10px;
    outline:0;
    color:#eee;
    background:#0d0d0d;
    border:1px solid rgba(255,255,255,.085);
    font-size:11px;
}

.modalInput:focus{
    border-color:rgba(255,255,255,.2);
}

textarea.modalInput{
    height:90px;
    padding:10px;
    resize:none;
}

.modalField{
    margin-bottom:14px;
}

.modalAction{
    width:100%;
    height:40px;
    border-radius:10px;
    color:#080808;
    background:#eee;
    font-size:11px;
    font-weight:700;
}

.modalAction:hover{
    background:#fff;
}

.modalSecondary{
    width:100%;
    height:38px;
    margin-top:7px;
    border-radius:10px;
    color:#aaa;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.07);
    font-size:10px;
}

.keyStatus{
    margin-top:7px;
    color:#555;
    font-size:9px;
}

.keyStatus.active{
    color:#aaa;
}

.fileInput{
    display:none;
}

/* =========================
   MOBILE
========================= */

@media(max-width:760px){
    .sidebar{
        position:fixed;
        left:0;
        top:0;
        bottom:0;
        z-index:30;
        transform:translateX(-105%);
        width:280px;
        box-shadow:20px 0 70px rgba(0,0,0,.45);
    }

    .sidebar.open{
        transform:none;
    }

    .mobileMenu{
        display:grid;
        place-items:center;
    }

    .topbar{
        padding:9px 11px;
    }

    .topActions .profileTopBtn{
        display:none;
    }

    .chatMessages{
        padding:25px 11px 14px;
    }

    .composerArea{
        padding:7px 10px 11px;
    }

    .messageContent{
        max-width:calc(100% - 37px);
    }

    .message.user .messageContent{
        max-width:86%;
    }

    .emptyState h1{
        font-size:21px;
    }

    #modelSelect{
        max-width:145px;
    }
}
</style>
</head>

<body>

<canvas id="saturn"></canvas>

<div id="app">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">

        <div class="brand">
            <div class="logo">N</div>
            <div class="brandText">
                <div class="brandName">NZX AI</div>
                <div class="brandSub">coding intelligence</div>
            </div>
        </div>

        <button class="newChat" id="newChatBtn">
            + New chat
        </button>

        <div class="history">
            <div class="historyTitle">Chats</div>
            <div id="historyList"></div>
        </div>

        <div class="profileCard" id="profileBtn">
            <div class="avatar" id="sidebarAvatar">
                N
            </div>

            <div class="profileInfo">
                <div class="profileName" id="sidebarName">
                    Nezzx
                </div>
                <div class="profileSub">
                    Local profile
                </div>
            </div>

            <div style="color:#555;font-size:12px">›</div>
        </div>

    </aside>

    <!-- MAIN -->
    <main class="main">

        <header class="topbar">

            <div class="topLeft">

                <button class="mobileMenu" id="mobileMenuBtn">
                    ☰
                </button>

                <div class="modelWrap">
                    <span class="modelDot"></span>

                    <select id="modelSelect">
                        <option value="gpt-6">GPT 6</option>
                        <option value="gpt-6-astra">GPT 6 Astra</option>
                        <option value="gpt-5.6-sol">GPT 5.6 Sol</option>
                    </select>
                </div>

            </div>

            <div class="topActions">

                <button class="topBtn" id="apiBtn">
                    Link Key
                </button>

                <button class="topBtn profileTopBtn" id="profileTopBtn">
                    Profile
                </button>

            </div>

        </header>

        <section class="chatMessages" id="chatMessages">
            <div class="chatInner" id="chatInner"></div>
        </section>

        <section class="composerArea">

            <div class="composer">

                <div class="attachPreview" id="attachPreview">
                    <div class="attachmentChip">
                        <span id="attachmentName">file</span>
                        <button class="removeAttach" id="removeAttach">×</button>
                    </div>
                </div>

                <textarea
                    id="prompt"
                    rows="1"
                    placeholder="Message Nyx..."
                    autocomplete="off"
                    spellcheck="false"
                ></textarea>

                <div class="composerBottom">

                    <div class="composerLeft">

                        <button
                            class="iconBtn"
                            id="attachBtn"
                            title="Attach file"
                        >＋</button>

                        <input
                            class="fileInput"
                            type="file"
                            id="fileInput"
                            accept="image/*,.txt,.lua,.luau,.js,.ts,.html,.css,.json,.py,.md,.xml,.csv,.cpp,.c,.h,.hpp"
                        >

                    </div>

                    <button class="sendBtn" id="sendBtn">
                        ↑
                    </button>

                </div>

            </div>

            <div class="footerHint">
                NZX AI can make mistakes. Check important code and information.
            </div>

        </section>

    </main>
</div>

<!-- API MODAL -->
<div class="modal" id="apiModal">

    <div class="modalBox">

        <div class="modalHeader">
            <div class="modalTitle">Connect API</div>
            <button class="closeModal" data-close="apiModal">×</button>
        </div>

        <div class="modalField">

            <label class="formLabel">
                Clean APIs key
            </label>

            <input
                class="modalInput"
                id="apiKeyInput"
                type="password"
                placeholder="sk-..."
                autocomplete="off"
            >

            <div class="keyStatus" id="keyStatus">
                No API key connected
            </div>

        </div>

        <button class="modalAction" id="saveApiBtn">
            Save API key
        </button>

        <button class="modalSecondary" id="removeApiBtn">
            Remove saved key
        </button>

    </div>

</div>

<!-- PROFILE MODAL -->
<div class="modal" id="profileModal">

    <div class="modalBox">

        <div class="modalHeader">
            <div class="modalTitle">Profile</div>
            <button class="closeModal" data-close="profileModal">×</button>
        </div>

        <div class="modalField">

            <label class="formLabel">
                Nickname
            </label>

            <input
                class="modalInput"
                id="profileNameInput"
                maxlength="30"
                placeholder="Your name"
            >

        </div>

        <div class="modalField">

            <label class="formLabel">
                Avatar URL
            </label>

            <input
                class="modalInput"
                id="profileAvatarInput"
                placeholder="https://..."
            >

        </div>

        <button class="modalAction" id="saveProfileBtn">
            Save profile
        </button>

    </div>

</div>

<script>
"use strict";

/* ============================================================
   NZX AI
   MODELS
   ============================================================

   These are the actual IDs sent to the API.

   HTML name       -> API model ID

   GPT 6           -> gpt-6
   GPT 6 Astra     -> gpt-6-astra
   GPT 5.6 Sol     -> gpt-5.6-sol

   If your API provider exposes different exact IDs,
   ONLY change the values below.
============================================================ */

const MODELS = {
    "gpt-6": {
        label: "GPT 6",
        id: "gpt-6"
    },

    "gpt-6-astra": {
        label: "GPT 6 Astra",
        id: "gpt-6-astra"
    },

function escapeHTML(value) {
    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function safeJSONParse(value, fallback) {
    try {
        return JSON.parse(value);

        return fallback;

}

}

/* ============================================================
   MARKDOWN

function renderMarkdown(text) {

    if (!text) return "";

    let source = String(text);

    const codeBlocks = [];

    source = source.replace(
        /```([a-zA-Z0-9_+-]*)\n?([\s\S]*?)```/g,
        (_, lang, code) => {

            const index = codeBlocks.length;

            codeBlocks.push({
                lang: lang || "code",
                code: code.replace(/\n$/, "")
            });

            return `@@CODE_BLOCK_${index}@@`;
        }
    );

    source = escapeHTML(source);

    source = source.replace(
        /`([^`\n]+)`/g,
        '<span class="inlineCode">$1</span>'
    );

    source = source.replace(
        /\*\*([^*]+)\*\*/g,
        "<strong>$1</strong>"
    );

    source = source.replace(
        /__([^_]+)__/g,
        "<strong>$1</strong>"
    );

    source = source.replace(
        /\*([^*\n]+)\*/g,
        "<em>$1</em>"
    );

    source = source.replace(
        /^### (.+)$/gm,
        "<h3>$1</h3>"
    );

    source = source.replace(
        /^## (.+)$/gm,
        "<h2>$1</h2>"
    );

    source = source.replace(
        /^# (.+)$/gm,
        "<h1>$1</h1>"
    );

    source = source.replace(
        /^> (.+)$/gm,
        "<blockquote>$1</blockquote>"
    );

    source = source.replace(
        /^\s*[-*] (.+)$/gm,
        "<li>$1</li>"
    );

    source = source.replace(
        /\n/g,
        "<br>"
    );

    source = source.replace(
        /(<li>.*?<\/li>)(?:<br>)?/g,
        "$1"
    );

    source = source.replace(
        /@@CODE_BLOCK_(\d+)@@/g,
        (_, index) => {

            const block = codeBlocks[index];

            return `
                <div class="codeBlock">
                    <div class="codeHeader">
                        <span>${escapeHTML(block.lang)}</span>

                        <button
                            class="copyCode"
                            data-code="${encodeURIComponent(block.code)}"
                        >
                            Copy
                        </button>
                    </div>

                    <pre><code>${escapeHTML(block.code)}</code></pre>
                </div>
            `;
        }
    );

    return source;
}

async function readSelectedFile() {

    if (!selectedFile) {
        return null;
    }

    const file = selectedFile;

    if (file.type.startsWith("image/")) {

        const base64 =
            await fileToBase64(file);

        return {
            type: "image",
            name: file.name,
            mime: file.type,
            data: base64
        };
    }

    try {

        const text =
            await file.text();

        return {
            type: "text",
            name: file.name,
            mime: file.type,
            data: text.slice(0, 120000)
        };

    } catch {

        return {
            type: "text",
            name: file.name,
            mime: file.type,
            data: ""
        };

    }
}


function fileToBase64(file) {

    return new Promise(
        (resolve, reject) => {

            const reader =
                new FileReader();

            reader.onload = () =>
                resolve(reader.result);

            reader.onerror = reject;

            reader.readAsDataURL(file);

        }
    );
}

    if (!attachment) {

         * OpenAI-compatible multimodal format.
         */

        return [
            {
                type: "text",
                text:
                    text ||
                    `Analyze this image: ${attachment.name}`
            },

            {
                type: "image_url",
                image_url: {
                    url: attachment.data
                }
            }
        ];

    }

    return `
${text || "Analyze this file."}

Attached file: ${attachment.name}

File contents:
--- BEGIN FILE ---
${attachment.data}
--- END FILE ---
`;
}

/* ============================================================
   API REQUEST
============================================================ */

async function requestAI(messages, onToken) {

    const apiKey = getApiKey();

    if (!apiKey) {

        throw new Error(
            "API key is not connected. Open “Link Key” and add your Clean APIs key."
        );

    }

    /*
     * IMPORTANT:
     *
     * This is where the selected model actually enters
     * the API request.
     *
     * Example:
     *
     * GPT 6       -> model: "gpt-6"
     * GPT 6 Astra -> model: "gpt-6-astra"
     * GPT 5.6 Sol -> model: "gpt-5.6-sol"
     */

    const requestBody = {
        model: getSelectedModel(),

        messages,

        stream: true,

        temperature: 0.25,

        max_tokens: 16384
    };

    controller =
        new AbortController();

    const response =
        await fetch(API_URL, {

            method: "POST",

            headers: {
                "Content-Type":
                    "application/json",

                "Authorization":
                    `Bearer ${apiKey}`
            },

            body:
                JSON.stringify(requestBody),

            signal:
                controller.signal
        });

    if (!response.ok) {

        let errorText =
            await response.text();

        let parsed =
            safeJSONParse(
                errorText,
                null
            );

        if (parsed?.error?.message) {
            errorText =
                parsed.error.message;
        }

        throw new Error(
            `API error ${response.status}: ${errorText || "Unknown error"}`
        );
    }

    const contentType =
        response.headers.get(
            "content-type"
        ) || "";

    /*
     * Non-stream JSON fallback.
     */

    if (
        contentType.includes(
            "application/json"
        )
    ) {

        const data =
            await response.json();

        const content =
            data?.choices?.[0]?.message?.content ||
            "";

        if (content) {
            onToken(content);
        }

        return content;
    }

    /*
     * SSE / streamed response.
     */

    if (!response.body) {

        const text =
            await response.text();

        onToken(text);

        return text;

    }

    const reader =
        response.body.getReader();

    const decoder =
        new TextDecoder();

    let buffer = "";
    let fullText = "";

    while (true) {

        const {
            value,
            done
        } = await reader.read();

        if (done) break;

        buffer +=
            decoder.decode(
                value,
                { stream:true }
            );

        const lines =
            buffer.split("\n");

        buffer =
            lines.pop() || "";

        for (const rawLine of lines) {

            const line =
                rawLine.trim();

            if (!line) continue;

            if (
                line === "data: [DONE]"
            ) {
                continue;
            }

            if (
                line.startsWith("data:")
            ) {

                const raw =
                    line.slice(5).trim();

                if (!raw) continue;

                const data =
                    safeJSONParse(
                        raw,
                        null
                    );

                if (!data) continue;

                const delta =
                    data
                        ?.choices?.[0]
                        ?.delta
                        ?.content;

                if (
                    typeof delta ===
                    "string"
                ) {

                    fullText += delta;

                    onToken(delta);

                }

                /*
                 * Some OpenAI-compatible
                 * providers return message.content
                 * instead of delta.content.
                 */

                const messageContent =
                    data
                        ?.choices?.[0]
                        ?.message
                        ?.content;

                if (
                    typeof messageContent ===
                    "string" &&
                    !delta
                ) {

                    fullText +=
                        messageContent;

                    onToken(
                        messageContent
                    );

                }

            }

        }

    }

    return fullText;
}


/* ============================================================
   SEND
============================================================ */

async function sendMessage() {

    if (isGenerating) {
        stopGeneration();
        return;
    }

    const text =
        prompt.value.trim();

    if (!text && !selectedFile) {
        return;
    }

    let chat =
        getCurrentChat();

    if (
        !chat.messages
    ) {
        chat.messages = [];
    }

    const userContent =
        await buildUserMessage(text);

    /*
     * What is saved locally.
     * For image messages, save a readable label instead
     * of the potentially huge base64 string.
     */

    let savedUserContent =
        text;

    if (selectedFile) {

        savedUserContent =
            text
                ? `${text}\n\n[Attached: ${selectedFile.name}]`
                : `[Attached: ${selectedFile.name}]`;

    }

    chat.messages.push({
        role: "user",
        content: savedUserContent
    });

    chat.title =
        getChatTitle(chat);

    updateChat(chat);

    renderChat();

    prompt.value = "";

    autoResize();

    selectedFile = null;

    fileInput.value = "";

    attachPreview.classList.remove(
        "show"
    );

    isGenerating = true;

    sendBtn.classList.add("stop");

    sendBtn.textContent = "■";

    const assistantRow =
        createStreamingAssistant();

    let assistantText = "";

    try {

        const apiMessages = [
            {
                role: "system",
                content: SYSTEM_PROMPT
            },

            ...chat.messages.map(
                message => ({
                    role: message.role,
                    content: message.content
                })
            )
        ];

        /*
         * Replace the final user message with the actual
         * multimodal/file version when necessary.
         */

        apiMessages[
            apiMessages.length - 1
        ] = {
            role: "user",
            content: userContent
        };

        await requestAI(
            apiMessages,
            token => {

                assistantText += token;

                updateStreamingAssistant(
                    assistantRow,
                    assistantText
                );

                scrollBottom();

            }
        );

        if (!assistantText.trim()) {

            assistantText =
                "The model returned an empty response.";

            updateStreamingAssistant(
                assistantRow,
                assistantText
            );

        }

        chat.messages.push({
            role: "assistant",
            content: assistantText
        });

        chat.title =
            getChatTitle(chat);

        updateChat(chat);

    } catch (error) {

        if (
            error?.name ===
            "AbortError"
        ) {

            if (assistantText.trim()) {

                chat.messages.push({
                    role: "assistant",
                    content:
                        assistantText
                });

                updateChat(chat);

            }

        } else {

            const message =
                `**Error:** ${error?.message || "Unknown error"}`;

            updateStreamingAssistant(
                assistantRow,
                message
            );

        }

    } finally {

        controller = null;

        isGenerating = false;

        sendBtn.classList.remove(
            "stop"
        );

        sendBtn.textContent = "↑";

        renderHistory();

    }
}


/* ============================================================
   STREAMING MESSAGE
============================================================ */

function createStreamingAssistant() {

    const row =
        document.createElement("div");

    row.className =
        "message assistant";

    row.innerHTML = `
        <div class="messageAvatar">
            N
        </div>

        <div class="messageContent">

            <div class="messageRole">
                Nyx · ${escapeHTML(
                    getSelectedModelLabel()
                )}
            </div>

            <div class="messageBubble">
                <div class="typing">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>

        </div>
    `;

    chatInner.appendChild(row);

    scrollBottom();

    return row;
}

function updateStreamingAssistant(
    row,
    text
) {

    const bubble =
        row.querySelector(
            ".messageBubble"
        );

    if (!bubble) return;

    bubble.innerHTML =
        renderMarkdown(text);

    bindCopyButtons(row);

}


/* ============================================================
   STOP
============================================================ */

function stopGeneration() {

    if (controller) {

        controller.abort();

        controller = null;

    }

    isGenerating = false;

    sendBtn.classList.remove(
        "stop"
    );

    sendBtn.textContent = "↑";

}

============================================================ */

    () => {

);


/* ============================================================

modelSelect.addEventListener(

/* ============================================================
   MODALS
============================================================ */

function openModal(modal) {
    modal.classList.add("show");
}

function closeModal(modal) {
    modal.classList.remove("show");
}

$("apiBtn").addEventListener(
    "click",
    () => {

        apiKeyInput.value =
            getApiKey();

        updateKeyStatus();

        openModal(apiModal);

    }
);

$("profileBtn").addEventListener(
    "click",
    () => {

        profileNameInput.value =
            profile.name || "";

        profileAvatarInput.value =
            profile.avatar || "";

        openModal(profileModal);

    }
);

$("profileTopBtn").addEventListener(
    "click",
    () => {

        profileNameInput.value =
            profile.name || "";

        profileAvatarInput.value =
            profile.avatar || "";

        openModal(profileModal);

    }
);

document
    .querySelectorAll("[data-close]")
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                const modal =
                    $(button.dataset.close);

                if (modal) {
                    closeModal(modal);
                }

            }
        );

    });

document
    .querySelectorAll(".modal")
    .forEach(modal => {

        modal.addEventListener(
            "click",
            event => {

                if (
                    event.target === modal
                ) {
                    closeModal(modal);
                }

            }
        );

    });


/* ============================================================
   PROFILE SAVE
============================================================ */

$("saveProfileBtn").addEventListener(
    "click",
    () => {

        profile.name =
            profileNameInput.value
                .trim()
                .slice(0, 30) ||
            "Nezzx";

        profile.avatar =
            profileAvatarInput.value
                .trim();

        saveProfile();

        updateProfileUI();

        closeModal(profileModal);

    }
);


/* ============================================================
   MOBILE SIDEBAR
============================================================ */

$("mobileMenuBtn").addEventListener(
    "click",
    () => {

        sidebar.classList.toggle(
            "open"
        );

    }
);


/* ============================================================
   ESC
============================================================ */

document.addEventListener(
    "keydown",
    event => {

        if (event.key === "Escape") {

            apiModal.classList.remove(
                "show"
            );

            profileModal.classList.remove(
                "show"
            );

            sidebar.classList.remove(
                "open"
            );

            if (isGenerating) {
                stopGeneration();
            }

        }

    }
);


/* ============================================================
   SATURN PARTICLE BACKGROUND
============================================================ */

const canvas =
    document.getElementById("saturn");

const ctx =
    canvas.getContext("2d", {
        alpha:true
    });

let W = 0;
let H = 0;
let DPR = 1;

let saturnParticles = [];
let ringParticles = [];

function resizeCanvas() {

    DPR =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    W =
        window.innerWidth;

    H =
        window.innerHeight;

    canvas.width =
        W * DPR;

    canvas.height =
        H * DPR;

    canvas.style.width =
        W + "px";

    canvas.style.height =
        H + "px";

    ctx.setTransform(
        DPR,
        0,
        0,
        DPR,
        0,
        0
    );

    createSaturn();

}

function createSaturn() {

    saturnParticles = [];
    ringParticles = [];

    const cx =
        W * .67;

    const cy =
        H * .49;

    const radius =
        Math.min(
            W,
            H
        ) * .18;

    const planetCount =
        Math.min(
            1150,
            Math.max(
                450,
                Math.floor(
                    W * H / 1800
                )
            )
        );

    for (
        let i = 0;
        i < planetCount;
        i++
    ) {

        const theta =
            Math.random() *
            Math.PI * 2;

        const phi =
            Math.acos(
                2 * Math.random() - 1
            );

        const r =
            radius *
            Math.cbrt(
                Math.random()
            );

        saturnParticles.push({

            x:
                cx +
                r *
                Math.sin(phi) *
                Math.cos(theta),

            y:
                cy +
                r *
                Math.cos(phi),

            z:
                r *
                Math.sin(phi) *
                Math.sin(theta),

            size:
                Math.random() *
                1.15 +
                .25,

            alpha:
                Math.random() *
                .7 +
                .2

        });

    }

    const ringCount =
        Math.min(
            1700,
            Math.max(
                700,
                Math.floor(
                    W * H / 1200
                )
            )
        );

    for (
        let i = 0;
        i < ringCount;
        i++
    ) {

        const angle =
            Math.random() *
            Math.PI * 2;

        const ringR =
            radius *
            (
                1.25 +
                Math.random() *
                .85
            );

        const thickness =
            (
                Math.random() -
                .5
            ) *
            radius *
            .12;

        ringParticles.push({

            angle,

            r:
                ringR +
                thickness,

            size:
                Math.random() *
                1 +
                .2,

            alpha:
                Math.random() *
                .55 +
                .08

        });

    }

}

let rotation =
    0;

function drawSaturn() {

    ctx.clearRect(
        0,
        0,
        W,
        H
    );

    rotation += .0009;

    const cx =
        W * .67;

    const cy =
        H * .49;

    const radius =
        Math.min(
            W,
            H
        ) * .18;

    /*
     * Back half of rings.
     */

    ctx.save();

    for (
        const p of ringParticles
    ) {

        const a =
            p.angle +
            rotation;

        const x =
            cx +
            Math.cos(a) *
            p.r;

        const y =
            cy +
            Math.sin(a) *
            p.r *
            .31;

        const depth =
            Math.sin(a);

        if (depth > .02) {
            continue;
        }

        ctx.globalAlpha =
            p.alpha *
            (
                .65 +
                Math.abs(depth) *
                .35
            );

        ctx.fillStyle =
            "#ffffff";

        ctx.fillRect(
            x,
            y,
            p.size,
            p.size
        );

    }

    ctx.restore();


    /*
     * Planet.
     */

    const sorted =
        saturnParticles
            .slice()
            .sort(
                (a,b) =>
                    a.z - b.z
            );

    for (
        const p of sorted
    ) {

        ctx.globalAlpha =
            p.alpha *
            (
                .5 +
                (
                    p.z /
                    radius
                ) *
                .25
            );

        ctx.fillStyle =
            "#ffffff";

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI * 2
        );

        ctx.fill();

    }


    /*
     * Front half of rings.
     */

    ctx.save();

    for (
        const p of ringParticles
    ) {

        const a =
            p.angle +
            rotation;

        const x =
            cx +
            Math.cos(a) *
            p.r;

        const y =
            cy +
            Math.sin(a) *
            p.r *
            .31;

        const depth =
            Math.sin(a);

        if (depth <= .02) {
            continue;
        }

        ctx.globalAlpha =
            p.alpha *
            (
                .7 +
                depth *
                .3
            );

        ctx.fillStyle =
            "#ffffff";

        ctx.fillRect(
            x,
            y,
            p.size,
            p.size
        );

    }

    ctx.restore();

    requestAnimationFrame(
        drawSaturn
    );

}

window.addEventListener(
    "resize",
    resizeCanvas
);


/* ============================================================
   INITIALIZE
============================================================ */

function init() {

    loadStorage();

    updateKeyStatus();

    /*
     * If there are no chats, create one.
     * Existing localStorage is NOT cleared.
     */

    if (!chats.length) {
        createChat();
    } else {
        renderHistory();
        renderChat();
    }

    resizeCanvas();

    requestAnimationFrame(
        drawSaturn
    );

    autoResize();

    prompt.focus();

}

init();

</script>
