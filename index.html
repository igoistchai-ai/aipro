<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4efe8">
<title>NZX AI</title>

<style>
*{box-sizing:border-box}

:root{
  --bg:#f5f0e8;
  --panel:#fffdf9;
  --panel2:#faf6ef;
  --border:#ddd4c7;
  --text:#241d17;
  --muted:#8d8175;
  --dark:#2c2119;
  --danger:#b54b42;
}

html,body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

button,input,textarea,select{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:100%;
  height:100dvh;
  display:grid;
  grid-template-columns:260px 1fr;
}

/* SIDEBAR */

.sidebar{
  height:100dvh;
  display:flex;
  flex-direction:column;
  padding:16px 13px;
  border-right:1px solid var(--border);
  background:#faf6ef;
}

.logo-row{
  display:flex;
  align-items:center;
  gap:10px;
  padding:7px 8px 18px;
}

.logo{
  width:38px;
  height:38px;
  display:grid;
  place-items:center;
  border-radius:12px;
  background:var(--dark);
  color:#fff;
  font-size:11px;
  font-weight:900;
}

.brand{
  font-size:17px;
  font-weight:850;
}

.brand-small{
  margin-top:2px;
  color:var(--muted);
  font-size:9px;
}

.new-chat{
  height:45px;
  border:1px solid var(--border);
  border-radius:13px;
  background:var(--panel);
  color:var(--text);
  font-weight:750;
}

.new-chat:hover{
  background:#f2eadf;
}

.history-title{
  display:flex;
  justify-content:space-between;
  padding:21px 8px 8px;
  color:var(--muted);
  font-size:10px;
  font-weight:800;
  text-transform:uppercase;
}

.history{
  flex:1;
  min-height:0;
  overflow:auto;
}

.history-item{
  display:flex;
  gap:8px;
  align-items:center;
  min-height:40px;
  padding:8px 9px;
  margin-bottom:3px;
  border-radius:10px;
  color:#665b51;
  font-size:12px;
  cursor:pointer;
}

.history-item:hover{
  background:#eee7dc;
}

.history-item.active{
  background:#e9dfd2;
  color:var(--text);
  font-weight:700;
}

.history-name{
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.profile{
  border-top:1px solid var(--border);
  margin-top:10px;
  padding-top:10px;
}

.profile button{
  width:100%;
  display:flex;
  align-items:center;
  gap:9px;
  border:0;
  background:transparent;
  padding:8px;
  border-radius:10px;
  text-align:left;
}

.profile button:hover{
  background:#eee7dc;
}

.avatar{
  width:34px;
  height:34px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:#d8c4af;
  font-weight:800;
  font-size:12px;
}

/* MAIN */

.main{
  min-width:0;
  height:100dvh;
  position:relative;
  display:flex;
  flex-direction:column;
}

.topbar{
  height:64px;
  flex:0 0 64px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  border-bottom:1px solid var(--border);
  background:rgba(245,240,232,.92);
  backdrop-filter:blur(14px);
  z-index:5;
}

.top-left{
  display:flex;
  align-items:center;
  gap:8px;
}

.mobile-menu{
  display:none;
  width:37px;
  height:37px;
  border:1px solid var(--border);
  background:var(--panel);
  border-radius:10px;
}

.model-label{
  color:var(--muted);
  font-size:9px;
  font-weight:800;
}

.model{
  height:37px;
  border:1px solid var(--border);
  background:var(--panel);
  border-radius:10px;
  padding:0 11px;
  color:var(--text);
  outline:none;
  font-size:11px;
  font-weight:750;
}

.top-actions{
  display:flex;
  align-items:center;
  gap:7px;
}

.key-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#c2b5a7;
}

.key-dot.active{
  background:#4d9b61;
}

.icon-btn{
  width:37px;
  height:37px;
  display:grid;
  place-items:center;
  border:1px solid var(--border);
  background:var(--panel);
  border-radius:10px;
}

/* CHAT */

.chat{
  flex:1;
  min-height:0;
  position:relative;
}

.messages{
  position:absolute;
  inset:0;
  overflow-y:auto;
  overflow-x:hidden;
  padding:28px 20px 175px;
  contain:layout paint;
}

.message{
  width:min(900px,100%);
  margin:0 auto 23px;
}

.user-row{
  display:flex;
  justify-content:flex-end;
}

.user-bubble{
  max-width:min(75%,700px);
  padding:11px 14px;
  border:1px solid #d9cdbf;
  border-radius:17px 17px 5px 17px;
  background:#e6dbcd;
  font-size:14px;
  line-height:1.5;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.ai-row{
  display:flex;
  gap:10px;
  align-items:flex-start;
}

.ai-avatar{
  width:32px;
  height:32px;
  flex:0 0 32px;
  display:grid;
  place-items:center;
  border-radius:10px;
  background:var(--dark);
  color:#fff;
  font-size:9px;
  font-weight:900;
}

.ai-content{
  min-width:0;
  width:min(850px,100%);
}

.ai-body{
  font-size:14px;
  line-height:1.65;
  overflow-wrap:anywhere;
}

.ai-body p{
  margin:0 0 11px;
}

.ai-body p:last-child{
  margin-bottom:0;
}

/*
  ВАЖНО:
  Во время streaming здесь НЕ создаются тысячи DOM-элементов.
  Поток сначала идёт в один text node.
*/

.stream-text{
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  font-size:13px;
  line-height:1.6;
}

/* CODE */

.code-card{
  border:1px solid #d7ccc0;
  border-radius:13px;
  overflow:hidden;
  background:#211b17;
  margin-top:10px;
}

.code-header{
  height:38px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 9px 0 12px;
  background:#2b241e;
}

.code-language{
  color:#c1b1a1;
  font:700 10px monospace;
  text-transform:uppercase;
}

.code-buttons{
  display:flex;
  gap:5px;
}

.code-btn{
  height:26px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:7px;
  background:rgba(255,255,255,.05);
  color:#eee3d7;
  padding:0 8px;
  font-size:10px;
}

.code-btn:hover{
  background:rgba(255,255,255,.1);
}

.code{
  margin:0;
  padding:14px;
  max-height:600px;
  overflow:auto;
  color:#f1e8dd;
  font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
  white-space:pre;
}

/* FILE */

.file-card{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:10px;
  padding:12px;
  border:1px solid var(--border);
  border-radius:14px;
  background:var(--panel);
}

.file-icon{
  width:40px;
  height:40px;
  display:grid;
  place-items:center;
  border-radius:10px;
  background:#eee6db;
}

.file-info{
  min-width:0;
  flex:1;
}

.file-name{
  font-size:12px;
  font-weight:800;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.file-size{
  margin-top:3px;
  color:var(--muted);
  font-size:9px;
}

.download{
  height:33px;
  padding:0 11px;
  border:0;
  border-radius:9px;
  background:var(--dark);
  color:#fff;
  font-size:10px;
  font-weight:800;
}

/* THINKING */

.thinking{
  display:flex;
  align-items:center;
  gap:7px;
  color:#8d8175;
  font-size:11px;
}

.thinking-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#806b59;
  animation:pulse 1s infinite;
}

@keyframes pulse{
  0%,100%{opacity:.3}
  50%{opacity:1}
}

/* COMPOSER */

.composer-wrap{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  z-index:4;
  padding:12px 18px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,var(--bg) 72%,transparent);
  pointer-events:none;
}

.composer{
  width:min(850px,100%);
  margin:auto;
  border:1px solid #d4c8bb;
  border-radius:18px;
  background:rgba(255,253,249,.98);
  box-shadow:0 12px 38px rgba(40,27,18,.1);
  overflow:hidden;
  pointer-events:auto;
}

.composer:focus-within{
  border-color:#bba995;
}

.attachments{
  display:flex;
  gap:6px;
  padding:8px 11px 0;
  flex-wrap:wrap;
}

.attachment{
  display:flex;
  gap:7px;
  align-items:center;
  padding:6px 8px;
  border:1px solid var(--border);
  border-radius:8px;
  background:#eee7dd;
  font-size:10px;
}

.attachment button{
  border:0;
  background:none;
}

textarea{
  display:block;
  width:100%;
  min-height:54px;
  max-height:190px;
  resize:none;
  border:0;
  outline:0;
  background:transparent;
  padding:14px;
  color:var(--text);
  font-size:14px;
  line-height:1.5;
}

.composer-bottom{
  height:43px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 10px 8px;
}

.tool{
  width:31px;
  height:31px;
  border:0;
  background:transparent;
  border-radius:8px;
}

.tool:hover{
  background:#eee7dd;
}

.send{
  height:34px;
  min-width:72px;
  padding:0 13px;
  border:0;
  border-radius:10px;
  background:var(--dark);
  color:#fff;
  font-size:11px;
  font-weight:850;
}

.send.stop{
  background:var(--danger);
}

.hint{
  text-align:center;
  margin-top:7px;
  color:#9b9085;
  font-size:9px;
}

/* WELCOME */

.welcome{
  width:min(700px,100%);
  margin:8vh auto 0;
  text-align:center;
}

.welcome-logo{
  width:54px;
  height:54px;
  display:grid;
  place-items:center;
  margin:auto;
  border-radius:16px;
  background:var(--dark);
  color:#fff;
  font-size:12px;
  font-weight:900;
}

.welcome h1{
  margin:15px 0 7px;
  font-size:29px;
  letter-spacing:-1px;
}

.welcome p{
  margin:0 0 22px;
  color:var(--muted);
  font-size:12px;
}

.suggestions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  text-align:left;
}

.suggestion{
  padding:12px;
  border:1px solid var(--border);
  border-radius:12px;
  background:rgba(255,253,249,.7);
  cursor:pointer;
}

.suggestion:hover{
  background:var(--panel);
}

.suggestion b{
  font-size:11px;
}

.suggestion span{
  display:block;
  margin-top:4px;
  color:var(--muted);
  font-size:9px;
}

/* MODAL */

.overlay{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:rgba(30,20,13,.32);
  backdrop-filter:blur(7px);
}

.overlay.open{
  display:flex;
}

.modal{
  width:min(430px,100%);
  border:1px solid var(--border);
  border-radius:19px;
  background:var(--panel);
  overflow:hidden;
  box-shadow:0 25px 80px rgba(20,12,7,.2);
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:17px;
  border-bottom:1px solid #eee5da;
}

.modal-title{
  font-size:14px;
  font-weight:850;
}

.close{
  width:29px;
  height:29px;
  border:0;
  border-radius:8px;
  background:#eee7dd;
}

.modal-body{
  padding:17px;
}

.field{
  margin-bottom:13px;
}

.field label{
  display:block;
  margin-bottom:6px;
  color:#776b60;
  font-size:10px;
  font-weight:800;
}

.field input{
  width:100%;
  height:41px;
  border:1px solid var(--border);
  border-radius:10px;
  outline:none;
  padding:0 10px;
  background:#fbf8f3;
  color:var(--text);
  font-size:11px;
}

.save{
  width:100%;
  height:42px;
  border:0;
  border-radius:10px;
  background:var(--dark);
  color:#fff;
  font-size:11px;
  font-weight:800;
}

/* MOBILE */

@media(max-width:760px){

  .app{
    grid-template-columns:1fr;
  }

  .sidebar{
    position:fixed;
    z-index:30;
    width:275px;
    transform:translateX(-100%);
    transition:transform .2s ease;
    box-shadow:20px 0 50px rgba(30,20,13,.15);
  }

  .sidebar.open{
    transform:none;
  }

  .mobile-menu{
    display:block;
  }

  .model-label{
    display:none;
  }

  .model{
    max-width:150px;
  }

  .messages{
    padding:20px 11px 175px;
  }

  .user-bubble{
    max-width:88%;
  }

  .composer-wrap{
    padding-left:8px;
    padding-right:8px;
  }

  .suggestions{
    grid-template-columns:1fr;
  }

  .welcome{
    margin-top:5vh;
    padding:0 8px;
  }

  .welcome h1{
    font-size:24px;
  }
}
</style>
</head>

<body>

<div class="app">

  <aside class="sidebar" id="sidebar">

    <div class="logo-row">
      <div class="logo">NZX</div>

      <div>
        <div class="brand">NZX AI</div>
        <div class="brand-small">Coding intelligence</div>
      </div>
    </div>

    <button class="new-chat" id="newChat">
      ＋ New chat
    </button>

    <div class="history-title">
      <span>History</span>
      <span id="chatCount">0</span>
    </div>

    <div class="history" id="history"></div>

    <div class="profile">
      <button id="profileButton">
        <div class="avatar" id="avatar">N</div>

        <div>
          <div id="profileName" style="font-size:12px;font-weight:800">
            NZX User
          </div>

          <div id="profileEmail"
               style="font-size:9px;color:#8d8175;margin-top:2px">
            Local profile
          </div>
        </div>
      </button>
    </div>

  </aside>

  <main class="main">

    <header class="topbar">

      <div class="top-left">

        <button class="mobile-menu" id="mobileMenu">
          ☰
        </button>

        <span class="model-label">
          MODEL
        </span>

        <select class="model" id="modelSelect">
          <option value="gpt-6-astra">gpt 6 Astra</option>
          <option value="gpt-6-sol">gpt 6 Sol</option>
          <option value="fable-5.1">fable 5.1</option>
          <option value="claude-haiku-4.5">haiku 4.5</option>
          <option value="claude-opus-5.5">opus 5.5</option>
          <option value="custom">Custom...</option>
        </select>

      </div>

      <div class="top-actions">

        <span class="key-dot" id="keyDot"></span>

        <button class="icon-btn" id="keyButton">
          🔑
        </button>

      </div>

    </header>

    <section class="chat">

      <div class="messages" id="messages"></div>

      <div class="composer-wrap">

        <div class="composer">

          <div class="attachments" id="attachments"></div>

          <textarea
            id="prompt"
            rows="1"
            placeholder="Напишите сообщение..."
            spellcheck="false"
            autocomplete="off"
          ></textarea>

          <div class="composer-bottom">

            <button class="tool" id="attachButton">
              ＋
            </button>

            <button class="send" id="sendButton">
              Send
            </button>

          </div>

        </div>

        <div class="hint">
          Enter — отправить · Shift + Enter — новая строка
        </div>

      </div>

    </section>

  </main>

</div>

<input id="fileInput" type="file" hidden multiple>

<!-- KEY MODAL -->

<div class="overlay" id="keyModal">

  <div class="modal">

    <div class="modal-head">
      <div class="modal-title">
        API settings
      </div>

      <button class="close" data-close="keyModal">
        ×
      </button>
    </div>

    <div class="modal-body">

      <div class="field">
        <label>Clean APIs key</label>

        <input
          id="apiKey"
          type="password"
          placeholder="API key"
          autocomplete="off"
        >
      </div>

      <div class="field">
        <label>Custom model ID</label>

        <input
          id="customModel"
          placeholder="model-id"
          autocomplete="off"
        >
      </div>

      <button class="save" id="saveSettings">
        Save settings
      </button>

    </div>

  </div>

</div>

<!-- PROFILE -->

<div class="overlay" id="profileModal">

  <div class="modal">

    <div class="modal-head">
      <div class="modal-title">
        Profile
      </div>

      <button class="close" data-close="profileModal">
        ×
      </button>
    </div>

    <div class="modal-body">

      <div class="field">
        <label>Name</label>
        <input id="profileInput" placeholder="NZX User">
      </div>

      <div class="field">
        <label>Description</label>
        <input id="profileEmailInput" placeholder="Local profile">
      </div>

      <button class="save" id="saveProfile">
        Save profile
      </button>

    </div>

  </div>

</div>

<script>
"use strict";

/*
===========================================================
NZX AI — PERFORMANCE EDITION
===========================================================

Главная проблема старой версии:

1. Каждый полученный токен полностью перерисовывал Markdown.
2. Каждый токен создавал новый HTML.
3. Огромный код постоянно парсился заново.
4. scrollTop менялся на каждый токен.
5. Из-за этого браузер тратил CPU на рендер вместо textarea.
6. На мобильных устройствах это особенно заметно.

Здесь streaming отделён от финального рендера.

Во время генерации:
AI -> buffer -> один text node

После генерации:
buffer -> финальный DOM

Textarea при этом вообще не перерисовывается.
===========================================================
*/

const API_URL =
  "https://www.cleanapis.com/v1/chat/completions";

const SYSTEM_PROMPT = `
You are NZX AI.

For normal questions:
Answer normally.

For requests to create, write, fix, modify, replace or generate code/files:
Return ONLY the complete source code.
No explanations.
No introductions.
No conclusions.
No Markdown code fences.
No text before or after the code.

The website converts code responses into downloadable files.

For Roblox Lua/Luau:
Use professional production-quality Luau.
Use correct Roblox APIs.
Respect Script, LocalScript and ModuleScript context.
Return the complete requested file.
Do not explain the code.

If the user requests a full replacement, return the entire replacement file.

Never claim code was tested if it was not tested.
`;

/* =========================
   DOM
========================= */

const messages =
  document.getElementById("messages");

const prompt =
  document.getElementById("prompt");

const sendButton =
  document.getElementById("sendButton");

const history =
  document.getElementById("history");

const chatCount =
  document.getElementById("chatCount");

const fileInput =
  document.getElementById("fileInput");

const attachments =
  document.getElementById("attachments");

const modelSelect =
  document.getElementById("modelSelect");

const keyDot =
  document.getElementById("keyDot");

const sidebar =
  document.getElementById("sidebar");

/* =========================
   STATE
========================= */

let chatId = crypto.randomUUID();

let chatMessages = [];

let selectedFiles = [];

let busy = false;

let controller = null;

let assistantBuffer = "";

let currentAssistantBody = null;

let thinkingTimer = null;

let thinkingSeconds = 0;

let streamRenderPending = false;

/* =========================
   STORAGE
========================= */

const STORAGE = {
  key:"nzx_clean_key",
  model:"nzx_model",
  custom:"nzx_custom_model",
  profile:"nzx_profile",
  chats:"nzx_chats"
};

function getKey(){
  return localStorage.getItem(STORAGE.key) || "";
}

function getChats(){

  try{
    return JSON.parse(
      localStorage.getItem(STORAGE.chats)
    ) || [];
  }catch{
    return [];
  }
}

function saveChats(value){

  localStorage.setItem(
    STORAGE.chats,
    JSON.stringify(value)
  );
}

/* =========================
   PROFILE
========================= */

function loadProfile(){

  let profile;

  try{
    profile =
      JSON.parse(
        localStorage.getItem(STORAGE.profile)
      );
  }catch{
    profile = null;
  }

  profile ||= {
    name:"NZX User",
    email:"Local profile"
  };

  document.getElementById("profileName")
    .textContent =
      profile.name;

  document.getElementById("profileEmail")
    .textContent =
      profile.email;

  document.getElementById("avatar")

/* =========================
   ESCAPE
========================= */

function escapeHTML(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

/* =========================
   TEXT EXTRACTION
========================= */

function contentText(content){

  if(typeof content === "string"){
    return content;
  }

  if(Array.isArray(content)){

    return content
      .filter(x => x?.type === "text")
      .map(x => x.text || "")
      .join(" ")
      .trim();
  }

  return "";
}

      .replace(/\s+/g," ")
      .trim();

  if(!text){
    return "New chat";
  }

  return text
    .split(" ")
    .slice(0,8)
    .join(" ")
    .slice(0,55);
}

  const chats =
    getChats();

    title:makeTitle(),
    messages:chatMessages,
    updatedAt:Date.now()
  };

  const index =
    chats.findIndex(
      x => x.id === chatId

    chats.unshift(object);

    (a,b) =>

  );

  );

/* =========================
   FAST STREAM RENDER
========================= */

/*
  Это самая важная часть.

  Мы НЕ делаем innerHTML на каждый token.

  Максимум один DOM update примерно
  каждые 50 миллисекунд.

  Даже если API присылает сотни chunks,
  textarea продолжает работать нормально.
*/

function scheduleStreamRender(){

  if(streamRenderPending){
    return;
  }

  streamRenderPending = true;

  setTimeout(
    () => {

      streamRenderPending = false;

      if(!currentAssistantBody){
        return;
      }

      currentAssistantBody.innerHTML = "";

      const text =
        document.createElement("div");

      text.className =
        "stream-text";

      text.textContent =
        assistantBuffer;

      currentAssistantBody.appendChild(text);

      scrollBottom(false);

    },
    50
  );
}

/* =========================
   FILES
========================= */

function extensionFor(text){

  const t =
    String(text)
      .toLowerCase();

  if(
    t.includes("luau") ||
    t.includes("roblox")
  ){
    return "luau";
  }

  if(t.includes("lua")){
    return "lua";
  }

  if(
    t.includes("html") ||
    t.includes("<html")
  ){
    return "html";
  }

  if(t.includes("css")){
    return "css";
  }

  if(
    t.includes("javascript") ||
    t.includes(" js ")
  ){
    return "js";
  }

  if(t.includes("typescript")){
    return "ts";
  }

  if(t.includes("python")){
    return "py";
  }

  if(t.includes("json")){
    return "json";
  }

  return "txt";
}

function filenameFor(userText,code){

  const explicit =
    userText.match(
      /(?:file|файл|filename|название)\s*[:=]?\s*[`"' ]*([\w.-]+\.[a-z0-9]+)/i
    );

  if(explicit){
    return explicit[1];
  }

  const ext =
    extensionFor(
      userText + "\n" + code
    );

  const names = {
    lua:"script.lua",
    luau:"script.luau",
    html:"index.html",
    css:"style.css",
    js:"script.js",
    ts:"script.ts",
    py:"main.py",
    json:"data.json",
    txt:"file.txt"
  };

  return names[ext] || "file.txt";
}

function looksLikeCode(text){

  const t =
    String(text || "")
      .trim();

  if(!t){
    return false;
  }

  let score = 0;

  const patterns = [

    /\blocal\s+\w+/,
    /\bfunction\s+\w+/,
    /\bgame:GetService/,
    /\bInstance\.new/,
    /\bworkspace\./,

    /\bconst\s+\w+/,
    /\blet\s+\w+/,
    /\bfunction\s*\(/,

    /<!doctype\s+html/i,
    /<html[\s>]/i,

    /\bdef\s+\w+\s*\(/,
    /\bimport\s+\w+/,

    /^\s*[\w.-]+\s*:\s*[\w"'[{]/m,
    /^\s*\.[\w-]+\s*\{/m
  ];

  for(const regex of patterns){

    if(regex.test(t)){
      score++;
    }
  }

  return score >= 2;
}

function cleanCode(text){

  let code =
    String(text || "")
      .trim();

  const match =
    code.match(
      /^```[^\n]*\n([\s\S]*?)\n```$/
    );

  if(match){
    code =
      match[1].trim();
  }

  return code;
}

function sizeText(value){

  const size =
    new Blob([value]).size;

  if(size < 1024){
    return size + " B";
  }

  if(size < 1024 * 1024){
    return (
      (size / 1024)
        .toFixed(1)
    ) + " KB";
  }

  return (
    (size / 1024 / 1024)
      .toFixed(2)
  ) + " MB";
}

function downloadFile(name,content){

  const blob =
    new Blob(
      [content],
      {
        type:
          "application/octet-stream"
      }
    );

  const url =
    URL.createObjectURL(blob);

  const link =
    document.createElement("a");

  link.href = url;
  link.download = name;

  document.body.appendChild(link);

  link.click();

  link.remove();

  setTimeout(
    () =>
      URL.revokeObjectURL(url),
    5000
  );
}

/* =========================
   API CONTENT
========================= */

function buildContent(text){

  if(!selectedFiles.length){
    return text;
  }

  const result = [];

  if(text.trim()){

    result.push({
      type:"text",
      text:text.trim()
    });
  }

  for(const file of selectedFiles){

    if(file.type.startsWith("image/")){

      result.push({
        type:"image_url",
        image_url:{
          url:file.data
        }
      });

    }else{

      result.push({
        type:"text",
        text:
          "\nAttached file: " +
          file.name +
          "\n\n" +
          file.data
      });
    }
  }

  return result;
}

/* =========================
   FILE READING
========================= */

function readFile(file){

  return new Promise(
    (resolve,reject) => {

      const reader =
        new FileReader();

      reader.onerror =
        () =>
          reject(
            new Error(
              "Cannot read " +
              file.name
            )
          );

      reader.onload =
        () => {

          if(
            file.type.startsWith(
              "image/"
            )
          ){

            resolve({
              name:file.name,
              type:file.type,
              data:reader.result
            });

          }else{

            let value =
              String(
                reader.result || ""
              );

            /*
              Ограничиваем размер текста,
              чтобы случайно не положить
              браузер огромным файлом.
            */

            if(value.length > 180000){

              value =
                value.slice(
                  0,
                  180000
                ) +
                "\n\n[File truncated]";
            }

            resolve({
              name:file.name,
              type:file.type ||
                "text/plain",
              data:value
            });
          }
        };

      if(
        file.type.startsWith(
          "image/"
        )
      ){
        reader.readAsDataURL(file);
      }else{
        reader.readAsText(file);
      }
    }
  );
}

async function chooseFiles(files){

  for(const file of files){

    if(
      file.size >
      5 * 1024 * 1024
    ){
      continue;
    }

    try{

      const parsed =
        await readFile(file);

      selectedFiles.push(
        parsed
      );

    }catch{}
  }

  renderAttachments();
}

function renderAttachments(){

  attachments.innerHTML = "";

  selectedFiles.forEach(
    (file,index) => {

      const item =
        document.createElement("div");

      item.className =

          }

      attachments.appendChild(item);
    }
  );
}

/* =========================
   SSE
========================= */

function getDelta(data){

  const choice =
    data?.choices?.[0];

  if(!choice){
    return "";
  }

  if(
    typeof choice.delta?.content ===
    "string"
  ){
    return choice.delta.content;
  }

  if(
    Array.isArray(
      choice.delta?.content
    )
  ){

    return choice.delta.content
      .filter(x =>
        x?.type === "text"
      )
      .map(x =>
        x.text || ""
      )
      .join("");
  }

  if(
    typeof choice.text ===
    "string"
  ){
    return choice.text;
  }

  return "";
}

async function streamResponse(response){

  const reader =
    response.body.getReader();

  const decoder =
    new TextDecoder();

  let buffer = "";

  while(true){

    const result =
      await reader.read();

    if(result.done){
      break;
    }

    buffer +=
      decoder.decode(
        result.value,
        {stream:true}
      );

    const lines =
      buffer.split(/\r?\n/);

    buffer =
      lines.pop() || "";

    for(const line of lines){

      const value =
        line.trim();

      if(
        !value ||
        !value.startsWith("data:")
      ){
        continue;
      }

      const data =
        value.slice(5).trim();

      if(data === "[DONE]"){
        return;
      }

      try{

        const json =
          JSON.parse(data);

        const delta =
          getDelta(json);

        if(delta){

          assistantBuffer +=
            delta;

          scheduleStreamRender();
        }

      }catch{
        /*
          Ignore malformed heartbeat
          lines from SSE.
        */
      }
    }
  }
}

/* =========================
   SEND
========================= */

async function send(){

  /*
    Если генерация уже идёт,
    кнопка становится STOP.
  */

  if(busy){

    stopGeneration();

    return;
  }

  const text =
    prompt.value.trim();

  if(
    !text &&
    !selectedFiles.length
  ){
    return;
  }

  const key =
    getKey();

  if(!key){

    openModal("keyModal");

    document.getElementById("apiKey")
      .focus();

    return;
  }

  busy = true;

  controller =
    new AbortController();

  sendButton.textContent =
    "Stop";

  sendButton.classList.add(
    "stop"
  );

  const content =
    buildContent(text);

  /*
    Сначала сохраняем user message.
  */

  chatMessages.push({
    role:"user",
    content
  });

  addUserMessage(content);

  /*
    Сразу очищаем composer.
    Генерация никак не влияет
    на textarea после этого.
  */

  prompt.value = "";

  resizePrompt();

  clearSelectedFiles();

  assistantBuffer = "";

  currentAssistantBody =
    createAssistant();

  startThinking(
    currentAssistantBody
  );

  scrollBottom(true);

  try{

    const response =
      await fetch(
        API_URL,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json",

            "Authorization":
              "Bearer " + key
          },

          body:JSON.stringify({

            model:getModel(),

            messages:[
              {
                role:"system",
                content:
                  SYSTEM_PROMPT
              },

              ...chatMessages
            ],

            stream:true,

            temperature:.2,

            max_tokens:16384

          }),

          signal:
            controller.signal
        }
      );

    if(!response.ok){

      let detail = "";

      try{
        detail =
          await response.text();
      }catch{}

      throw new Error(
        "API " +
        response.status +
        (
          detail
            ? ": " + detail
            : ""
        )
      );
    }

    stopThinking();

    await streamResponse(
      response
    );

    /*
      Последний render.
    */

    if(streamRenderPending){

      streamRenderPending =
        false;
    }

    const answer =
      assistantBuffer.trim();

    /*
      Теперь только после окончания
      streaming решаем, файл это или
      обычный ответ.
    */

    if(
      answer &&
      looksLikeCode(answer)
    ){

      const code =
        cleanCode(answer);

      const filename =
        filenameFor(
          text,
          code
        );

      currentAssistantBody
        .innerHTML = "";

      currentAssistantBody
        .appendChild(
          createFileCard(
            filename,
            code
          )
        );

    }else{

      /*
        Обычный ответ.
        Здесь можно сделать простой
        Markdown-render только ОДИН раз.
      */

      currentAssistantBody
        .innerHTML =
          renderSimpleMarkdown(
            answer
          );
    }

    chatMessages.push({
      role:"assistant",
      content:answer
    });

    saveCurrentChat();

  }catch(error){

    stopThinking();

    if(
      error.name ===
      "AbortError"
    ){

      const partial =
        assistantBuffer.trim();

      if(partial){

        currentAssistantBody
          .innerHTML = "";

        const stopped =
          document.createElement("div");

        stopped.className =
          "stream-text";

        stopped.textContent =
          partial;

        currentAssistantBody
          .appendChild(stopped);

        chatMessages.push({
          role:"assistant",
          content:partial
        });

        saveCurrentChat();

      }else{

        currentAssistantBody
          .innerHTML =
            `<p style="color:#a64c43">
              Generation stopped.
            </p>`;
      }

    }else{

      currentAssistantBody
        .innerHTML =
          `<p style="color:#a64c43">
            ${escapeHTML(
              error.message ||
              "Request failed"
            )}
          </p>`;
    }

  }finally{

    stopThinking();

    busy = false;

    controller = null;

    currentAssistantBody = null;

    sendButton.textContent =
      "Send";

    sendButton.classList.remove(
      "stop"
    );

    scrollBottom(true);
  }
}

/* =========================
   STOP
========================= */

function stopGeneration(){

  if(
    controller &&
    busy
  ){

    controller.abort();
  }
}

/* =========================
   SIMPLE MARKDOWN
========================= */

function renderSimpleMarkdown(text){

  let html =
    escapeHTML(text);

  /*
    Код в обычном Markdown показываем
    только если модель сама всё-таки
    прислала fence.
  */

  html =
    html.replace(
      /```([a-zA-Z0-9_+-]*)\n([\s\S]*?)```/g,
      (_,lang,code) => {

        return `
          <div class="code-card">

            <div class="code-header">

              <span class="code-language">
                ${escapeHTML(
                  lang || "code"
                )}
              </span>

            </div>

            <pre class="code">
              ${code}
            </pre>

          </div>
        `;
      }
    );

  /*
    Если fence не было,
    оставляем переносы строк.
  */

  if(!html.includes("code-card")){

    html =
      html.replace(
        /\n\n/g,
        "</p><p>"
      );

    html =
      "<p>" +
      html +
      "</p>";

    html =
      html.replace(
        /\n/g,
        "<br>"
      );
  }

  return html;
}

/* =========================
   LOAD CHAT
========================= */

function loadChat(id){

  const chat =
    getChats().find(
      x => x.id === id
    );

  if(!chat){
    return;
  }

  if(busy){
    stopGeneration();
  }

  chatId =
    chat.id;

  chatMessages =
    Array.isArray(chat.messages)
      ? chat.messages
      : [];

  clearChat();

  for(const item of chatMessages){

    if(item.role === "user"){

      addUserMessage(
        item.content
      );

    }else if(
      item.role === "assistant"
    ){

      const body =
        createAssistant();

      const answer =
        contentText(
          item.content
        );

      if(
        looksLikeCode(answer)
      ){

        body.appendChild(
          createFileCard(
            filenameFor(
              "",
              answer
            ),
            cleanCode(answer)
          )
        );

      }else{

        body.innerHTML =
          renderSimpleMarkdown(
            answer
          );
      }
    }
  }

  renderHistory();

  closeSidebar();
}

/* =========================
   NEW CHAT
========================= */

document.getElementById("newChat")
  .addEventListener(
    "click",
    () => {

      if(busy){
        stopGeneration();
      }

      chatId =
        crypto.randomUUID();

      chatMessages = [];

      clearSelectedFiles();

      clearChat();

      showWelcome();

      prompt.value = "";

      resizePrompt();

      renderHistory();

      closeSidebar();

      prompt.focus();
    }
  );

/* =========================
   PROMPT PERFORMANCE
========================= */

function resizePrompt(){

  /*
    Единственное изменение textarea
    происходит при вводе пользователя.
    Streaming сюда вообще не касается.
  */

  prompt.style.height =
    "auto";

  prompt.style.height =
    Math.min(
      prompt.scrollHeight,
      190
    ) + "px";
}

prompt.addEventListener(
  "input",
  resizePrompt
);

prompt.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      send();
    }
  }
);

/* =========================
   FILE INPUT
========================= */

document.getElementById("attachButton")
  .addEventListener(
    "click",
    () => fileInput.click()
  );

fileInput.addEventListener(
  "change",
  () => {

    chooseFiles(
      [...fileInput.files]
    );
  }
);

/* =========================
   SUGGESTIONS
========================= */

document.addEventListener(
  "click",
  event => {

    const item =
      event.target.closest(
        ".suggestion"
      );

    if(!item){
      return;
    }

    prompt.value =
      item.dataset.prompt || "";

    resizePrompt();

    prompt.focus();
  }
);

/* =========================
   MOBILE SIDEBAR
========================= */

document.getElementById("mobileMenu")
  .addEventListener(
    "click",
    () => {

      sidebar.classList.toggle(
        "open"
      );
    }
  );

function closeSidebar(){
  sidebar.classList.remove("open");
}

/* =========================
   INITIALIZATION
========================= */

function init(){

  loadProfile();

  updateKeyState();

  loadModel();

  renderHistory();

  const chats =
    getChats();

  if(chats.length){

    loadChat(
      chats[0].id
    );

  }else{

    showWelcome();
  }

  resizePrompt();
}

init();

</script>
